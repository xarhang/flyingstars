    <text x="400" y="174" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="6.8" fill="#166534" text-anchor="middle">✓ 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖭒.𖭕m + 𖭕 𖬒𖬰𖬝𖬰 𖬍𖬩𖬵 𖬆𖬲𖬟𖬰 + 𖬀𖬶𖬧𖬵 𖬃𖬯 + 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬊𖬲𖬟𖬰</text>

    <!-- Residential Ground -->
