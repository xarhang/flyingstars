    <text x="400" y="157" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7" fill="#F8FAFC" text-anchor="middle">𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬊𖬲𖬟𖬰</text>

    <!-- Warm Spotlight Lanterns on Rear Wall -->
