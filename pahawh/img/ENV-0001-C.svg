
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="cemeteryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- TOP TITLE HUD BAR -->
  <rect x="0" y="0" width="800" height="42" fill="#0F172A"/>
  <rect x="18" y="9" width="95" height="24" rx="4" fill="#DC2626"/>
  <text x="65" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">ENV-0001-C</text>
  <text x="122" y="26" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10.8" fill="#F8FAFC">𖬄𖬲𖬦𖬵 𖭓: 𖬗𖬪𖬰 𖬗𖬰𖬢𖬰 𖬖𖬲𖬤𖬵 𖬄𖬦𖬵 𖬉𖬝𖬰 (𖬄𖬰𖬜 𖬂𖬲 Xuan Wu) - 𖬃𖬰𖬝𖬰 𖬐𖬰𖬦 𖬓𖬥𖬰 𖬄𖬥𖬰 &amp; 𖬅𖬨𖬵 𖬐𖬲𖬤𖬵 𖬈𖬝𖬵</text>
  <rect x="580" y="9" width="105" height="24" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="632" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8" text-anchor="middle">𖬓𖬥𖬰 𖬀𖬶𖬤 Sha</text>
  <rect x="692" y="9" width="90" height="24" rx="4" fill="#991B1B"/>
  <text x="737" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10.5" fill="#FEF2F2" text-anchor="middle">𖬀𖬶𖬯 𖬖𖬰𖬞</text>

  <!-- LEFT COLUMN CARDS -->
  <rect x="12" y="48" width="174" height="185" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="48" width="174" height="24" rx="6" fill="#475569"/>
  <text x="100" y="64" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">🐢 𖬗𖬪𖬰 𖬗𖬰𖬢𖬰 𖬖𖬲𖬤𖬵 𖬄𖬰𖬜 𖬂𖬲</text>
  <text x="20" y="86" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#1E293B">• 𖬗𖬰𖬢𖬰 𖬒𖬰𖬮𖬵 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵 𖬉𖬝𖬰</text>
  <text x="20" y="103" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#1E293B">• 𖬖𖬲𖬤𖬵 𖬄𖬰𖬜 𖬂𖬲: 𖬗𖬮 𖬅𖬧𖬵 𖬌𖬡 𖬄𖬥𖬰</text>
  <text x="20" y="120" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#1E293B">• 𖬄𖬥𖬰 𖬗𖬰𖬢𖬰: 𖬄𖬥𖬰 𖬓𖬥𖬰 𖬀𖬶𖬤 𖬕𖬰𖬯𖬵</text>
  <text x="20" y="137" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬃𖬰𖬝𖬰 𖬐𖬰𖬦 𖬁𖬲𖬬 𖬖𖬲𖬪𖬵, 𖬅𖬨𖬵 𖬐𖬲𖬤𖬵 𖬈𖬝𖬵</text>
  <rect x="18" y="148" width="162" height="42" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="99" y="162" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.2" fill="#0F172A" text-anchor="middle">𖬒𖬶𖬣 𖬉𖬰𖬥𖬰 𖬀𖬶𖬯 𖬖𖬰𖬞 &lt;𖭕𖭐-𖭑𖭐𖭐m</text>
  <text x="99" y="178" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#475569" text-anchor="middle">𖬐𖬲𖬤 𖬆𖬝𖬰 𖬂𖬝𖬰 '𖬌𖬡 𖬐𖬲𖬯' 𖬊𖬲𖬟𖬰</text>

  <rect x="12" y="240" width="174" height="202" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="240" width="174" height="24" rx="6" fill="#DC2626"/>
  <text x="100" y="256" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">🚫 𖬒𖬶𖬯 𖬇𖬰𖬞 𖬙𖬯𖬵 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵</text>
  <text x="20" y="278" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬙𖬯𖬵 𖬂𖬲𖬣 𖬌𖬲𖬡 𖬖𖬜𖬰 𖬖𖬲𖬦𖬵 𖬕𖬝 𖬗𖬰𖬢𖬰</text>
  <text x="20" y="295" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬙𖬯𖬵 𖬒𖬶𖬣 𖬋𖬡 𖬔𖬲𖬮𖬰 𖬒𖬲𖬞 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵</text>
  <text x="20" y="312" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬙𖬯𖬵 𖬄𖬰𖬧𖬵 𖬅𖬟 𖬙𖬰𖬪𖬵 𖬕𖬝 𖬒𖬧𖬵 𖬗𖬰𖬢𖬰</text>
  <rect x="18" y="325" width="162" height="48" rx="4" fill="#FEE2E2"/>
  <text x="99" y="340" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.2" fill="#B91C1C" text-anchor="middle">𖬙𖬝𖬰 𖬂𖬤 𖬖𖬲𖬤𖬵 𖬄𖬰𖬜 𖬂𖬲:</text>
  <text x="24" y="354" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#7F1D1D">• 𖬖𖬲𖬤𖬵 𖬄𖬦𖬵 𖬐𖬲𖬤 𖬆𖬝𖬰 '𖬐𖬰𖬡-𖬐𖬶𖬧𖬵'</text>
  <text x="24" y="366" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#7F1D1D">• 𖬊𖬲𖬟𖬰 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵 𖬒 𖬐𖬰𖬡 𖬃𖬞 𖬌𖬡</text>

