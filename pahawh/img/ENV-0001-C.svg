    <polygon points="400,180 397,185 403,185" fill="#0284C7"/>
    <polygon points="400,210 397,205 403,205" fill="#0284C7"/>
    <text x="440" y="196" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="6.5" fill="#0284C7">𖬂𖬟𖬰 𖬈𖬰𖬞𖬰 >𖭑𖭐-𖭑𖭕m</text>

    <!-- Safe Main House Seated Solidly -->
    <polygon points="290,210 400,185 510,210" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
    <rect x="295" y="210" width="210" height="70" fill="#FEF08A" stroke="#854D0E" stroke-width="1.8" rx="3"/>
    <text x="400" y="232" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9.5" fill="#1E293B" text-anchor="middle">𖬉𖬝𖬰 𖬒𖬰𖬮𖬵 (Yang Zhai) - 𖬖𖬲𖬤𖬵 𖬄𖬦𖬵 𖬐𖬶𖬧𖬵</text>
    <text x="400" y="247" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7" fill="#15803D" text-anchor="middle">✓ 𖬄𖬰𖬧𖬵 𖬅𖬟 𖬙𖬰𖬪𖬵 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖬐𖬶𖬧𖬵 / 𖬃𖬰𖬝𖬰 𖬂𖬲𖬣 𖬒𖬶𖬣 𖬋𖬡 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵</text>
    <text x="400" y="260" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#475569" text-anchor="middle">𖬑𖬮𖬰 𖬌𖬡 𖬐𖬲𖬯 𖬂𖬶𖬧𖬵 𖬊𖬲𖬟𖬰 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵 𖬓𖬰𖬩𖬰 𖬅𖬨𖬵 𖬐𖬲𖬤𖬵 𖬈𖬝𖬵</text>
    <rect x="392" y="275" width="16" height="5" fill="#1E293B"/>

    <!-- Ming Tang Lawn In Front -->
    <rect x="260" y="295" width="280" height="75" rx="5" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="400" y="315" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="8" fill="#15803D" text-anchor="middle">𖬖𖬰𖬟𖬰 𖬗𖬪𖬰 𖬖𖬰 𖬈𖬪𖬵 𖬄𖬲𖬟 𖬈𖬲𖬩𖬵 (𖬗𖬪𖬰 𖬖𖬰)</text>
    <text x="400" y="332" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#166534" text-anchor="middle">✓ 𖬋𖬰𖬯𖬵 𖬀𖬶𖬧𖬵 𖬗𖬪𖬰 𖬆𖬶𖬩𖬵 &amp; 𖬓𖬥𖬰 Yang</text>
    <text x="400" y="347" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#0284C7" text-anchor="middle">• 𖬅𖬤𖬵 𖬓𖬥𖬰 Sheng 𖬃𖬦𖬵 𖬔𖬟𖬰 𖬔𖬶𖬮𖬵 𖬕𖬲𖬯𖬵</text>

    <!-- Front Road -->
