    <text x="400" y="65" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="8.5" fill="#475569" text-anchor="middle">𖬗𖬪𖬰 𖬗𖬰𖬢𖬰 𖬖𖬲𖬤𖬵 𖬄𖬲𖬜𖬰 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵 𖬉𖬝𖬰</text>
    <text x="400" y="78" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="6.8" fill="#DC2626" text-anchor="middle">𖬑𖬶𖬞 𖬗𖬮𖬰 (⛔ 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬒𖬶)</text>
    
