    <line x1="200" y1="412" x2="600" y2="412" stroke="#FBBF24" stroke-width="2" stroke-dasharray="8,6"/>
    <text x="400" y="420" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.5" fill="#FFFFFF" text-anchor="middle">𖬉 𖬒𖬲𖬞 𖬈𖬪𖬵 𖬄𖬲𖬟 𖬈𖬲𖬩𖬵</text>

    <rect x="420" y="396" width="30" height="8" rx="1.5" fill="#15803D"/>
    <text x="435" y="402" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="5.5" fill="#FFFFFF" text-anchor="middle">𖬌𖬲𖬡 𖬗𖬶𖬜</text>
