  <text x="701" y="352" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#581C87" text-anchor="middle">𖬃𖬰𖬝𖬰 𖬆𖬰𖬪𖬵 𖬒𖬪𖬵 𖬗𖬰𖬢𖬰 𖬕𖬲 𖬃𖬞</text>
  <text x="701" y="364" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.2" fill="#7E22CE" text-anchor="middle">𖬓𖬰𖬝𖬰 𖬀𖬶𖬧𖬵 𖬖𖬰𖬞𖬰 𖬃𖬯 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵 𖬉𖬝𖬰</text>

