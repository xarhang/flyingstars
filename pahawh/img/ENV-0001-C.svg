  <text x="701" y="64" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="8.8" fill="#FFFFFF" text-anchor="middle">🛡️ 𖭔 𖬒𖬲𖬯𖬵 𖬉 𖬓𖬰𖬩𖬰 𖬖𖬲𖬤𖬵 𖬄𖬦𖬵</text>
  <text x="622" y="86" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#14532D">𖭑. 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖬐𖬶𖬧𖬵 𖭒.𖭒-𖭒.𖭕m 𖬖𖬲𖬤𖬵 𖬄𖬦𖬵</text>
  <text x="622" y="103" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#14532D">𖭒. 𖬓𖬯 𖭕 𖬒𖬰𖬝𖬰 𖬍𖬩𖬵 𖬆𖬲𖬟𖬰 𖬑𖬮𖬰 𖬌𖬡</text>
  <text x="622" y="120" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#14532D">𖭓. 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬊𖬲𖬟𖬰 𖬎𖬶𖬟𖬵 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝</text>
  <text x="622" y="137" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#14532D">𖭔. 𖬀𖬶𖬧𖬵 𖬖𖬰𖬞𖬰 Warm Yang 𖬃𖬯 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵</text>
  <rect x="620" y="148" width="162" height="30" rx="3" fill="#DCFCE7"/>
  <text x="701" y="161" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="6.8" fill="#166534" text-anchor="middle">𖬒𖬲𖬯𖬵 𖬋𖬯: 𖬊𖬲𖬟𖬰 𖬖𖬲𖬤𖬵 𖬄𖬦𖬵 𖬒 𖬐𖬰𖬡</text>
  <text x="701" y="172" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.2" fill="#14532D" text-anchor="middle">𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 + 𖬍𖬩𖬵 𖬆𖬲𖬟𖬰 = 𖬌𖬡 𖬄𖬰𖬜 𖬂𖬲</text>

