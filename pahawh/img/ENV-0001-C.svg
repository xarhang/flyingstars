  <text x="400" y="472" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#94A3B8" text-anchor="middle">𖬉 𖬓𖬰𖬩𖬰: 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖬐𖬶𖬧𖬵 𖭒.𖭕m + 𖭕 𖬒𖬰𖬝𖬰 𖬍𖬩𖬵 𖬆𖬲𖬟𖬰 𖬒𖬲𖬞 𖬑𖬮𖬰 𖬌𖬡 𖬐𖬲𖬯 + 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬊𖬲𖬟𖬰 + 𖬄𖬰𖬧𖬵 𖬅𖬟 𖬙𖬰𖬪𖬵 𖬅𖬡 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖬐𖬶𖬧𖬵 𖬄𖬲𖬟 𖬉𖬝𖬰.</text>
