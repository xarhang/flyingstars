  <text x="577" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8" text-anchor="middle">𖬓𖬥𖬰 𖬗𖬮𖬰/𖬆𖬰 (𖬗𖬮𖬰/𖬆𖬰)</text>

