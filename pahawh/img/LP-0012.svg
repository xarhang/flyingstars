        <text x="400" y="244" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.2" fill="#0369A1" text-anchor="middle">• 𖬓𖬤 𖬐𖬰𖬦 𖬈𖬲𖬞𖬰: 𖬈𖬲𖬞𖬰 𖬔𖬯𖬰 𖬑𖬶𖬪𖬵 𖬃𖬲𖬤𖬰</text>
