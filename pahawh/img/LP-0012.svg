  <rect x="614" y="48" width="174" height="24" rx="6" fill="#0284C7"/>
  <text x="700" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬏𖬧 𖬓𖬰𖬝𖬰 𖬉𖬝𖬰 &amp; 𖬗𖬪𖬰</text>
  <text x="622" y="88" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#0369A1">• 𖬏𖬧: 𖬖𖬲𖬤𖬵 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵 𖭑/𖭓 𖬄𖬲𖬟 𖬒𖬲𖬜</text>
  <text x="622" y="108" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#0369A1">• 𖬄𖬥𖬰 𖬄𖬰𖬜𖬰 𖬄𖬦𖬵 𖬒𖬲𖬜 𖬅𖬰𖬫𖬵 𖬊𖬲𖬟𖬰</text>
  <text x="622" y="128" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#0369A1">• 𖬕𖬝 (𖬕𖬝): 𖬕𖬝 𖬈𖬪𖬵 𖬔𖬶𖬧𖬵 𖬗𖬞𖬰</text>
  <text x="622" y="148" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#0369A1">• 𖬄𖬥𖬰 (𖬄𖬥𖬰): 𖬄𖬥𖬰 𖬎𖬶𖬟𖬵 𖬒𖬶𖬤𖬰 𖬒𖬲𖬜</text>
  
  <rect x="620" y="158" width="162" height="34" rx="4" fill="#E0F2FE"/>
  <text x="700" y="171" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#0369A1" text-anchor="middle">𖬄𖬰𖬧𖬵 𖬅𖬟 𖬙𖬰𖬪𖬵: 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖬒𖬲𖬜 𖬅𖬰𖬫𖬵</text>
  <text x="700" y="184" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#0284C7" text-anchor="middle">𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖬐𖬶𖬧𖬵 𖬃𖬰𖬝𖬰 𖬖𖬰𖬤𖬰 𖬒𖬶𖬣 𖬋𖬡</text>

  <!-- Bottom-Right Card: Remedies & Taboos (Y=206 to 442) -->
  <rect x="614" y="206" width="174" height="236" rx="6" fill="#FDF4FF" stroke="#A855F7" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="206" width="174" height="24" rx="6" fill="#9333EA"/>
  <text x="700" y="222" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬉 𖬎𖬦𖬰 𖬓𖬥𖬰 &amp; 𖬓𖬰𖬩𖬰</text>
  <text x="622" y="246" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#6B21A8">𖭑. 𖬓𖬯 𖬍𖬩𖬵 𖬆𖬲𖬟𖬰 𖬏𖬰𖬡 𖬒𖬲𖬜 𖬄𖬦𖬵 𖭙 𖬒𖬰𖬝𖬰</text>
  <text x="622" y="266" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#6B21A8">𖭒. 𖬂𖬝𖬰 𖬗𖬲𖬪𖬵 𖬈𖬲𖬞𖬰 𖬒𖬲𖬜 𖬀𖬰𖬩𖬰 𖬈𖬪𖬵</text>
  <text x="622" y="286" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#6B21A8">𖭓. 𖬓𖬰𖬝𖬰 𖬀𖬶𖬧𖬵 𖬒𖬪𖬵 𖬉 𖬏𖬰𖬡 𖬒𖬲𖬜 𖬅𖬰𖬫𖬵</text>
  <text x="622" y="306" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#6B21A8">𖭔. 𖬓𖬰𖬝𖬰 𖬗𖬪𖬰 𖬈𖬪𖬵 𖬒 𖬒𖬪𖬵 𖬉 𖬋𖬰𖬯𖬵 𖬔𖬶𖬮𖬵</text>

  <rect x="620" y="326" width="162" height="106" rx="4" fill="#F3E8FF"/>
  <text x="700" y="342" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8" fill="#7E22CE" text-anchor="middle">𖬒𖬶𖬯 𖬇𖬰𖬞 𖬙𖬯𖬵 (𖬒𖬶𖬯 𖬇𖬰𖬞 𖬙𖬯𖬵)</text>
  <text x="626" y="360" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#9333EA">• 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬀𖬲𖬢𖬰 𖬒𖬲𖬜 𖬅𖬡 𖬈𖬪𖬵 (𖬑𖬮𖬰 Reverse Bow)</text>
  <text x="626" y="377" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#9333EA">• 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬎𖬩𖬰 𖬗𖬲𖬪𖬵 𖬈𖬲𖬞𖬰 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵</text>
  <text x="626" y="394" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#9333EA">• 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬂𖬲𖬣 𖬒𖬶𖬣 𖬌𖬲𖬡 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵</text>
  <text x="700" y="418" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#7E22CE" text-anchor="middle">✓ 𖬆𖬲𖬟 𖬃𖬤𖬵 &amp; 𖬀𖬶𖬧𖬵 𖬒𖬪𖬵 𖬉 𖬍𖬥𖬰</text>

