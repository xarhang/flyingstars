
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Top HUD Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#0F172A"/>
  <rect x="18" y="9" width="70" height="24" rx="4" fill="#DC2626"/>
  <text x="53" y="25" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">LP-0007</text>
  <text x="100" y="26" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="12.5" fill="#F8FAFC">𖬖𖬰𖬟𖬰 𖬗𖬮𖬰 𖬈𖬰𖬪𖬵 𖬖𖬲𖬜𖬵 𖬔𖬰𖬡 𖬋𖬰𖬥 (𖬖𖬰𖬟𖬰 𖬗𖬮𖬰 𖬈𖬰𖬪𖬵 𖬖𖬲𖬜𖬵 𖬉𖬰𖬝 𖬔𖬰𖬡 𖬋𖬰𖬥 Sha)</text>
  <rect x="670" y="9" width="112" height="24" rx="4" fill="#991B1B"/>
  <text x="726" y="25" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10.5" fill="#FEF2F2" text-anchor="middle">𖬈𖬝𖬵: 𖭑𖭘 / 𖭑𖭐𖭐</text>

  <!-- ========================================================================= -->
  <!-- LEFT COLUMN: CARDS (X=18 to 182) -->
  <!-- ========================================================================= -->
  <rect x="12" y="48" width="174" height="150" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="48" width="174" height="24" rx="6" fill="#16A34A"/>
  <text x="100" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬒𖬶𖬣 𖬌𖬲𖬡 &amp; 𖬖𖬰𖬟𖬰 𖬗𖬪𖬰</text>
  <text x="20" y="88" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#14532D">• 𖬒𖬶𖬣 𖬌𖬲𖬡 𖬗𖬶𖬜: 𖬖𖬲𖬤𖬵 𖬖𖬰𖬥𖬰, 𖬈𖬰𖬞𖬰 𖬄 𖬉𖬰𖬝 &gt;𖭑𖭕m</text>
  <text x="26" y="106" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#14532D">• 𖬉 𖬈𖬰𖬪𖬰: 𖬅𖬰𖬫𖬵 𖬓𖬲𖬦 𖬑𖬶𖬦, 𖬙𖬯𖬵 𖬖𖬰𖬤𖬰 𖬑𖬧𖬵</text>
  <text x="26" y="124" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#14532D">• 𖬃𖬰𖬝𖬰 𖬐𖬰𖬦 𖬈𖬲𖬞𖬰: 𖬗𖬪𖬰 𖬌𖬧𖬰 𖬐𖬶𖬝 𖬖𖬰 𖬅𖬤𖬵 𖬓𖬥𖬰</text>
  <rect x="18" y="138" width="162" height="52" rx="4" fill="#DCFCE7"/>
  <text x="100" y="156" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#15803D" text-anchor="middle">• 𖬓𖬤 𖬐𖬰𖬦 𖬈𖬲𖬞𖬰: 𖬈𖬲𖬞𖬰 𖬔𖬯𖬰 𖬑𖬶𖬪𖬵 𖬃𖬲𖬤𖬰 𖬒𖬲𖬜 𖬀𖬰𖬩𖬰</text>
  <text x="100" y="174" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#166534" text-anchor="middle">✓ 𖬉 𖬅𖬰𖬫𖬵 𖬐𖬰𖬦 𖬔𖬤𖬵 𖬍𖬥𖬰 (𖬉 𖬅𖬰𖬫𖬵 𖬐𖬰𖬦 𖬔𖬤𖬵 𖬍𖬥𖬰)</text>

  <rect x="12" y="204" width="174" height="240" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="18" y="204" width="164" height="24" rx="6" fill="#D97706"/>
  <text x="100" y="220" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬓𖬥𖬰 𖬂𖬲𖬝𖬰 𖬖𖬤 &amp; 𖬁𖬲𖬬 𖬄𖬟</text>
  <text x="26" y="242" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#78350F">• 𖬓𖬥𖬰 𖬖𖬰𖬟𖬰 𖬗𖬮𖬰: 𖬐𖬲𖬥 𖬏𖬰𖬧𖬵 (𖬐𖬲𖬥 𖬏𖬰𖬧𖬵)</text>
  <text x="26" y="259" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#78350F">• 𖬔𖬰𖬯 𖬗𖬮𖬰: 𖬔𖬰𖬡 𖬋𖬰𖬥, Huo Sha</text>
  <text x="26" y="276" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#78350F">• ✗ 𖬃𖬰𖬝𖬰 𖬄𖬟: 𖬁𖬲𖬬 𖬆𖬰 &amp; 𖬍𖬩𖬵</text>
  <text x="26" y="293" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#78350F">• 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬄𖬟: 𖬑𖬠𖬵 𖭖, 𖭗, 𖭓, 𖭔</text>
  <text x="26" y="310" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#78350F">• ✓ 𖬄𖬟: 𖬁𖬲𖬬 𖬓𖬥𖬰 𖬗𖬮𖬰 (𖭒, 𖭘)</text>
  
  <rect x="18" y="324" width="162" height="110" rx="4" fill="#FEF3C7"/>
  <text x="100" y="342" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.8" fill="#92400E" text-anchor="middle">𖬓𖬥𖬰 𖬐𖬲𖬥 𖬏𖬰𖬧𖬵 𖬆𖬰 (Huo Sha)</text>
  <text x="100" y="360" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#78350F" text-anchor="middle">𖬐𖬲𖬥 𖬏𖬰𖬧𖬵 𖬎𖬶𖬥 𖬆𖬰: 𖬋𖬰𖬝𖬵 𖬒𖬰𖬦</text>
  <text x="100" y="378" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#78350F" text-anchor="middle">𖬐𖬲𖬤 𖬆𖬝𖬰 𖬔𖬲𖬯𖬵 𖬄 𖬑𖬮𖬰 𖭔 𖬖𖬲𖬜𖬵</text>
  <text x="100" y="398" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.2" fill="#B45309" text-anchor="middle">✓ 𖬓𖬰𖬩𖬰 𖬒 𖬆𖬰𖬞 𖬓𖬥𖬰 𖬂𖬲𖬤𖬵 𖬅𖬲𖬨𖬵</text>

  <!-- ========================================================================= -->
  <!-- RIGHT COLUMN: CARDS (X=618 to 782) -->
  <!-- ========================================================================= -->
  <rect x="614" y="48" width="174" height="150" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="48" width="174" height="24" rx="6" fill="#DC2626"/>
  <text x="700" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬉 𖬒𖬯𖬵 𖬈𖬮𖬵 𖬉 𖬔𖬯𖬵</text>
  <text x="622" y="88" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#991B1B">• 𖬓𖬥𖬰 𖬐𖬲𖬥 𖬏𖬰𖬧𖬵 𖬆𖬰 (Huo Sha)</text>
  <text x="626" y="106" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#991B1B">• 𖬈𖬰𖬪𖬰 𖬍𖬝𖬰 𖬄 𖬉𖬰𖬝 𖬅𖬩𖬵 𖬅𖬰𖬥𖬰</text>
  <text x="626" y="124" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#991B1B">• 𖬂𖬲𖬝 𖬄𖬰𖬟𖬵 𖬇𖬲𖬩𖬵, 𖬋𖬰𖬝𖬵 𖬒𖬰𖬦</text>
  <text x="626" y="142" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#991B1B">• 𖬔𖬶𖬮𖬵 𖬕𖬲𖬯𖬵 𖬌𖬪𖬵 𖬂𖬜 𖬑𖬯 𖬎𖬲𖬝</text>
  <rect x="620" y="152" width="162" height="38" rx="4" fill="#FEE2E2"/>
  <text x="700" y="167" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#B91C1C" text-anchor="middle">𖬄𖬰𖬧𖬵 𖬅𖬟 𖬙𖬰𖬪𖬵: 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖬐𖬶𖬧𖬵</text>
  <text x="700" y="181" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#DC2626" text-anchor="middle">𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬃𖬲𖬧𖬵 𖬇𖬰𖬦 𖬅𖬡 𖬄 𖬉𖬰𖬝</text>

  <rect x="614" y="204" width="174" height="240" rx="6" fill="#FDF4FF" stroke="#A855F7" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="618" y="204" width="164" height="24" rx="6" fill="#9333EA"/>
  <text x="700" y="220" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬉 𖬓𖬰𖬩𖬰 𖭔 𖬄𖬶 𖬐𖬡</text>
  <text x="626" y="242" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#6B21A8">𖭑. 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖭒.𖭒m 𖬔𖬲𖬯𖬵 𖬄</text>
  <text x="626" y="259" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#6B21A8">𖭒. 𖬓𖬯 𖬍𖬩𖬵 𖬆𖬲𖬟𖬰 𖬇𖬰𖬬𖬰 𖬑𖬯</text>
  <text x="626" y="276" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#6B21A8">𖭓. 𖬓𖬰𖬝𖬰 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬊𖬲𖬟𖬰</text>
  <text x="626" y="293" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#6B21A8">𖭔. 𖬑𖬮𖬰 𖬖𖬰𖬜 𖬖𖬰𖬪𖬵 / 𖬏𖬧 𖬉𖬲𖬜𖬰 𖬈𖬰𖬪𖬰</text>
  
  <rect x="620" y="324" width="162" height="110" rx="4" fill="#F3E8FF"/>
  <text x="700" y="342" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.8" fill="#7E22CE" text-anchor="middle">𖬒𖬶𖬯 𖬉 𖬙𖬯𖬵 (𖬒𖬶𖬯 𖬇𖬰𖬞 𖬙𖬯𖬵)</text>
  <text x="630" y="360" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#9333EA">• 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬙𖬰𖬪𖬵 𖬅𖬡 𖬄 𖬉𖬰𖬝</text>
  <text x="630" y="377" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#9333EA">• 𖬙𖬯𖬵 𖬂𖬲𖬣 𖬌𖬲𖬡 𖬅𖬡 𖬄 𖬉𖬰𖬝</text>
  <text x="630" y="394" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#9333EA">• 𖬙𖬯𖬵 𖬗𖬲𖬪𖬵 𖬈𖬲𖬞𖬰 𖬅𖬡 𖬄 𖬉𖬰𖬝</text>
  <text x="700" y="418" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.2" fill="#7E22CE" text-anchor="middle">✓ 𖬑𖬮𖬰 𖬖𖬰𖬜 𖬖𖬰𖬪𖬵 𖬐𖬶𖬝 𖬂𖬶𖬧𖬵 𖬊𖬲𖬟𖬰</text>

