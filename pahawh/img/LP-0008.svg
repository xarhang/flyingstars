  <rect x="12" y="206" width="174" height="24" rx="6" fill="#D97706"/>
  <text x="100" y="222" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬓𖬥𖬰 𖭘 𖬖𖬲𖬜𖬵 &amp; 𖬁𖬲𖬬 𖬄𖬟</text>
  <text x="20" y="246" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#78350F">• 𖬓𖬥𖬰 𖬖𖬰𖬟𖬰 𖬗𖬮𖬰: 𖬓𖬥𖬰 𖬐𖬲𖬥 𖬏𖬰𖬧𖬵 𖬉𖬰𖬝</text>
  <text x="20" y="266" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#78350F">• ✗ 𖬃𖬰𖬝𖬰 𖬄𖬟: 𖬁𖬲𖬬 𖬓𖬥𖬰 𖬗𖬮𖬰 &amp; 𖬍𖬩𖬵</text>
  <text x="20" y="286" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#78350F">(𖬑𖬠𖬵 𖭒, 𖭘, 𖭓, 𖭔) 𖬅𖬲𖬡 nstab 𖬄𖬦𖬵</text>
  <text x="20" y="306" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#78350F">• 𖬃𖬰𖬝𖬰 𖬐𖬰𖬦 𖬁𖬲𖬬 𖬖𖬲𖬪𖬵 𖬎𖬦𖬰 𖬓𖬥𖬰</text>
  <text x="20" y="326" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#78350F">• 𖬃𖬰𖬝𖬰 𖬄𖬟 𖬅𖬡 𖬉𖬝𖬰 𖬁𖬲𖬬 𖬒𖬰𖬮𖬵</text>
  
  <rect x="18" y="346" width="162" height="86" rx="4" fill="#FEF3C7"/>
  <text x="100" y="364" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="8" fill="#92400E" text-anchor="middle">𖬈𖬲𖬧𖬵 𖬉 𖬒𖬯𖬵 𖬈𖬮𖬵 (Impact)</text>
  <text x="100" y="382" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#78350F" text-anchor="middle">𖬅𖬲𖬡 𖬀𖬲𖬢𖬰 𖬔𖬤𖬵, 𖬒𖬰𖬦 𖬄𖬰𖬜𖬰 𖬄𖬦𖬵</text>
  <text x="100" y="402" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7" fill="#B45309" text-anchor="middle">𖬂𖬲𖬝𖬰 𖬖𖬤 𖬓𖬥𖬰 &amp; 𖭘 𖬖𖬲𖬜𖬵 𖭘 𖬖𖬲𖬜𖬵</text>
  <text x="100" y="418" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7" fill="#D97706" text-anchor="middle">✓ 𖬐𖬶𖬟 𖬑𖬯 𖬂𖬲𖬤𖬵 𖬅𖬲𖬨𖬵 𖬍𖬥𖬰</text>

