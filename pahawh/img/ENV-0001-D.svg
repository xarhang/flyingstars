  <rect x="0" y="445" width="800" height="35" fill="#0F172A"/>
  <text x="400" y="460" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.5" fill="#F8FAFC" text-anchor="middle">𖬙𖬝𖬰 𖬂𖬤: 𖬗𖬰𖬢𖬰 𖬄𖬲𖬟 𖬗𖬮𖬰 𖬓𖬤 𖬀𖬶𖬤 Sha 𖬗𖬣𖬰 𖬙𖬯𖬵 𖬂𖬝𖬰 𖬉𖬝𖬰 𖬄𖬤𖬵! 𖬐𖬲𖬤 𖬆𖬝𖬰 𖬂𖬶𖬝𖬰 𖬒𖬰𖬪𖬵 𖬗𖬰𖬦𖬰 𖬔𖬟𖬰 𖬎𖬩𖬰 𖬗𖬮𖬰 𖭑.𖭕m 𖬗𖬪𖬰 𖭔𖭙 𖬆𖬰𖬩.</text>
  <text x="400" y="472" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#94A3B8" text-anchor="middle">𖬉 𖬀𖬶𖬧𖬵 𖬉𖬝𖬰: 𖬏𖬰𖬝 𖬗𖬮𖬰 𖬔𖬪𖬰 𖬆𖬲𖬟 𖬑𖬮𖬰 𖬖𖬰𖬜 𖬖𖬰𖬪𖬵 𖬓𖬲𖬞 𖬃𖬰𖬤𖬵 𖬏𖬧 𖬉𖬲𖬜𖬰 𖬈𖬰𖬪𖬰, 𖬑𖬲𖬝𖬰 𖬓𖬤 𖬂𖬝𖬰 𖬉𖬝𖬰 𖬅𖬡 𖬖𖬰𖬟𖬰 𖬏𖬧 𖬗𖬮𖬰 𖬆𖬲𖬟 𖬃𖬤𖬵 𖬘𖬰𖬮.</text>
