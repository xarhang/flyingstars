    <text x="485" y="260" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.5" fill="#15803D" text-anchor="middle">𖬖𖬰𖬟𖬰 𖬗𖬪𖬰 𖬖𖬰 (𖬗𖬪𖬰 𖬖𖬰)</text>
    <text x="485" y="275" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#166534" text-anchor="middle">✓ 𖬋𖬰𖬯𖬵 𖬔𖬶𖬮𖬵 𖬕𖬲𖬯𖬵 &amp; 𖬓𖬥𖬰 Sheng 𖬃𖬦𖬵</text>
