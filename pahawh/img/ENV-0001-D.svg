  <text x="622" y="103" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#581C87">𖭒. 𖬎𖬩𖬰 𖭑.𖭕-𖭒m 𖬗𖬪𖬰 𖭔𖭙 𖬆𖬰𖬩</text>
