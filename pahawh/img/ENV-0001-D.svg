  <rect x="18" y="9" width="95" height="24" rx="4" fill="#DC2626"/>
  <text x="65" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">ENV-0001-D</text>
  <text x="122" y="26" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10.8" fill="#F8FAFC">𖬄𖬲𖬦𖬵 𖭔: 𖬆𖬰𖬦𖬵 𖬗𖬰𖬢𖬰 𖬒𖬰𖬮𖬵 𖬄𖬲𖬟 𖬖𖬰𖬟𖬰 𖬗𖬮𖬰 - 𖬀𖬶𖬤 Sha 𖬗𖬣𖬰 &amp; 𖬒𖬲𖬯𖬵 𖬉 𖬓𖬰𖬩𖬰 𖬗𖬮𖬰</text>
  <rect x="580" y="9" width="105" height="24" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="632" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8" text-anchor="middle">𖬓𖬥𖬰 𖬀𖬶𖬤 Sha</text>
  <rect x="692" y="9" width="90" height="24" rx="4" fill="#991B1B"/>
  <text x="737" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10.5" fill="#FEF2F2" text-anchor="middle">𖬀𖬶𖬯 𖬖𖬰𖬞</text>

  <!-- LEFT COLUMN CARDS -->
  <rect x="12" y="48" width="174" height="185" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="48" width="174" height="24" rx="6" fill="#DC2626"/>
  <text x="100" y="64" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">🚫 𖬆𖬰𖬦𖬵 𖬗𖬰𖬢𖬰 𖬄𖬲𖬟 𖬖𖬰𖬟𖬰 𖬗𖬮𖬰</text>
  <text x="20" y="86" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬐𖬰𖬦 𖬆𖬰𖬦𖬵 𖬗𖬰𖬢𖬰/𖬒𖬰𖬪𖬵 𖬗𖬰𖬦𖬰 𖬄𖬲𖬟 𖬗𖬮𖬰</text>
  <text x="20" y="103" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬓𖬤 𖬀𖬶𖬤 Sha 𖬗𖬣𖬰 𖬀𖬲𖬟</text>
  <text x="20" y="120" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬉𖬝𖬰 𖬁𖬲𖬬 𖬔𖬶𖬯 𖬒𖬰𖬮𖬵 𖬄𖬤𖬵 𖬑𖬶𖬧𖬵</text>
  <text x="20" y="137" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬅𖬲𖬡 𖬒𖬰𖬦 𖬃𖬰𖬝𖬰 𖬍𖬥𖬰, 𖬌𖬪𖬵 𖬀𖬲𖬪𖬵</text>
  <rect x="18" y="148" width="162" height="42" rx="4" fill="#FEE2E2" stroke="#FCA5A5"/>
  <text x="99" y="162" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.2" fill="#B91C1C" text-anchor="middle">𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬂𖬝𖬰 𖬉𖬝𖬰 𖬄𖬤𖬵!</text>
  <text x="99" y="178" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#7F1D1D" text-anchor="middle">𖬐𖬲𖬤 𖬆𖬝𖬰 𖬓𖬰𖬩𖬰 𖬑𖬮𖬰 𖬈𖬲𖬩𖬵 𖬂𖬝𖬰 𖬉𖬝𖬰</text>

  <rect x="12" y="240" width="174" height="202" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="240" width="174" height="24" rx="6" fill="#DC2626"/>
  <text x="100" y="256" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">⚠️ 𖬇𖬰𖬞 𖬙𖬯𖬵 𖬒𖬲𖬞 𖬖𖬰𖬪𖬰!</text>
  <text x="20" y="278" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬙𖬯𖬵 𖬗𖬧 𖬙𖬰𖬪𖬵 𖬄𖬤𖬵 𖬆𖬰𖬦𖬵 𖬗𖬰𖬢𖬰</text>
  <text x="20" y="295" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬙𖬯𖬵 𖬗𖬧 𖬒𖬲𖬬 𖬒𖬶𖬦/𖬑𖬮𖬰 𖬒𖬲𖬬 𖬄𖬤𖬵</text>
  <text x="20" y="312" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬙𖬯𖬵 𖬏𖬰𖬝 𖬗𖬮𖬰 𖬓𖬤 𖬃𖬰𖬝𖬰 𖬂𖬶𖬝𖬰 𖬒𖬰𖬪𖬵 𖬗𖬰𖬦𖬰</text>
  <rect x="18" y="325" width="162" height="48" rx="4" fill="#FEE2E2"/>
  <text x="99" y="340" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.2" fill="#B91C1C" text-anchor="middle">𖬒𖬲𖬯𖬵 𖬋𖬯 𖬐𖬰𖬡:</text>
  <text x="24" y="354" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#7F1D1D">• 𖬗𖬮𖬰 𖬗𖬰𖬢𖬰 𖬐𖬰𖬦 𖬓𖬥𖬰 𖬀𖬶𖬤 𖬒𖬰𖬧𖬵</text>
  <text x="24" y="366" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#7F1D1D">• 𖬗𖬪𖬰 𖬗𖬮𖬰 𖭔𖭙 𖬆𖬰𖬩 𖬇𖬰𖬬𖬰 𖬓𖬥𖬰 Yang</text>

