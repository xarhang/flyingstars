  <text x="701" y="256" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="8.8" fill="#FFFFFF" text-anchor="middle">📐 𖬉 𖬀𖬶𖬧𖬵 𖬉𖬝𖬰 𖬄𖬲𖬟 𖬗𖬮𖬰</text>
  <text x="622" y="278" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#14532D">• 𖬊𖬰𖬜𖬵 𖬆𖬰𖬦𖬵 𖬗𖬰𖬢𖬰 𖬑𖬮𖬰 𖬖𖬰𖬜 𖬖𖬰𖬪𖬵</text>
  <text x="622" y="295" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#14532D">• 𖬂𖬝𖬰 𖬉𖬝𖬰 𖬅𖬡 '𖬖𖬰𖬟𖬰 𖬗𖬮𖬰 𖬆𖬲𖬟 𖬃𖬤𖬵'</text>
  <text x="622" y="312" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#14532D">• 𖬓𖬯 𖬌𖬧𖬰 𖬐𖬶𖬝 + 𖬖𖬰𖬪𖬵 𖬍𖬥𖬰 𖬄𖬶𖬢</text>
  <rect x="620" y="325" width="162" height="48" rx="3" fill="#DCFCE7"/>
  <text x="701" y="339" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7" fill="#166534" text-anchor="middle">𖬇𖬰𖬞 𖬙𖬯𖬵 𖬒𖬲𖬞 𖬖𖬰𖬪𖬰:</text>
  <text x="701" y="352" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#14532D" text-anchor="middle">𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬂𖬝𖬰 𖬗𖬧 𖬙𖬰𖬪𖬵 𖬅𖬡 𖬄𖬤𖬵</text>
  <text x="701" y="364" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.2" fill="#166534" text-anchor="middle">𖬑𖬮𖬰 𖬖𖬰𖬜 𖬖𖬰𖬪𖬵 𖬓𖬲𖬞 𖬃𖬰𖬤𖬵 𖬏𖬧 𖬉𖬲𖬜𖬰 𖬈𖬰𖬪𖬰</text>

