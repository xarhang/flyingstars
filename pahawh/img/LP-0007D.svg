  <text x="700" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬉 𖬓𖬰𖬝𖬰 𖬉𖬝𖬰 &amp; 𖬉 𖬏𖬰𖬧𖬵</text>
  <text x="622" y="88" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#0369A1">• 𖬏𖬧 𖬓𖬰𖬝𖬰 𖬉𖬝𖬰: 𖬓𖬰𖬝𖬰 𖬅𖬡 𖬖𖬲𖬤𖬵 𖬄𖬰𖬜𖬰 𖬄𖬦𖬵 𖬗𖬞𖬰 𖭑/𖭓</text>
  <text x="622" y="108" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#0369A1">• 𖬒𖬶𖬣 𖬇𖬲𖬜𖬰: 𖬂𖬟𖬰 𖬈𖬰𖬞𖬰 𖬎𖬰𖬩𖬵 𖬄 𖬉𖬰𖬝 𖬈𖬪𖬵 &gt;𖭑𖭕-𖭒𖭐m</text>
