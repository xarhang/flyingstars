  <text x="622" y="148" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#0369A1">• 𖬄𖬥𖬰 (𖬄𖬥𖬰): 𖬄𖬥𖬰 𖬄𖬰𖬜𖬰 𖬄𖬦𖬵 𖬗𖬞𖬰 𖬐𖬰𖬡 𖬒𖬶𖬩𖬰</text>
  
