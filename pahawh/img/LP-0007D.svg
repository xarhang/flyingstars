  <text x="20" y="246" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• 𖬓𖬥𖬰 𖬔𖬝: 𖬓𖬥𖬰 𖬐𖬲𖬥 𖬉𖬰𖬝 (𖬐𖬲𖬥 𖬏𖬰𖬧𖬵 Sha 𖭓-𖭘/𖭙)</text>
