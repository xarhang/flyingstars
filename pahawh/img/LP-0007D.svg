  <text x="20" y="148" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#14532D">• 𖬓𖬤 𖬐𖬰𖬦 𖬈𖬲𖬞𖬰: 𖬏𖬰𖬝 𖬄 𖬉𖬰𖬝 𖬒𖬶𖬪𖬵 𖬉𖬶𖬝𖬰! 𖬏𖬰𖬩𖬰 𖬈𖬪𖬵 𖬉𖬝𖬰</text>
  
  <rect x="18" y="158" width="162" height="34" rx="4" fill="#DCFCE7"/>
