  <text x="100" y="184" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#166534" text-anchor="middle">✓ 𖬉 𖬅𖬰𖬫𖬵 𖬓𖬲𖬦 𖬑𖬶𖬦 𖬍𖬥𖬰 𖬔𖬤𖬵 𖬂𖬶𖬧𖬵 𖬊𖬲𖬟𖬰 sha</text>

