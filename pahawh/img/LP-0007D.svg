  <text x="20" y="286" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• 𖬃𖬰𖬝𖬰 𖬄𖬟: 𖬁𖬲𖬬 𖬓𖬥𖬰 𖬆𖬰 (𖬑𖬠𖬵 𖭖, 𖭗) 𖬔𖬟𖬰 𖬈𖬲𖬞𖬰 (𖬑𖬠𖬵 𖭑)</text>
  <text x="20" y="306" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• 𖬄𖬰𖬜𖬰 𖬄𖬦𖬵: Xuan Wu 𖬗𖬞𖬰 𖬀𖬲𖬟 𖬓𖬤 𖬓𖬰𖬝𖬰 𖬖𖬰𖬤𖬰 𖭙𖭐°</text>
  <text x="20" y="326" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• 𖬓𖬥𖬰 𖬓𖬥𖬰: 𖭒𖭘/𖭑𖭐𖭐 (𖬓𖬰𖬩𖬰 𖬗𖬲𖬧𖬵 𖬉𖬰𖬤𖬰 𖬓𖬯𖬵 𖭗𖭕/𖭑𖭐𖭐)</text>
  
