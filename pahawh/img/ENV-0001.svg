  <text x="108" y="26" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="11" fill="#F8FAFC">𖬗𖬪𖬰 𖬗𖬰𖬢𖬰: 𖬒𖬰𖬮𖬵 𖬖𖬲𖬤𖬵 𖬄𖬲𖬜𖬰 vs 𖬖𖬲𖬤𖬵 𖬄𖬲𖬟 𖬖𖬰𖬟𖬰 𖬗𖬮𖬰 (𖬌𖬲𖬞 𖬈𖬦 𖬗𖬰𖬢𖬰)</text>
