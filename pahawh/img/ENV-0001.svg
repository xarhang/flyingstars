  <text x="100" y="64" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">⚰️ 𖬗𖬪𖬰 𖬗𖬰𖬢𖬰 𖬖𖬲𖬤𖬵 𖬄𖬲𖬜𖬰</text>
  <text x="20" y="86" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#1E293B">• 𖬒𖬶𖬣 𖬈𖬰𖬞𖬰 𖬍𖬥𖬰: >𖭑𖭕𖭐-𖭒𖭐𖭐m</text>
  <text x="20" y="103" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#1E293B">• 𖬓𖬤 𖬉𖬰𖬥𖬰 &lt;𖭕𖭐-𖭑𖭐𖭐m: 𖬓𖬥𖬰 𖬀𖬶𖬤 𖬕𖬰𖬯𖬵</text>
  <text x="20" y="120" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#1E293B">• 𖬅𖬲𖬡 𖬒𖬰𖬦, 𖬅𖬨𖬵 𖬐𖬲𖬤𖬵 𖬈𖬝𖬵</text>
