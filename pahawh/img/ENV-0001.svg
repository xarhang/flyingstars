  <text x="99" y="146" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.2" fill="#0F172A" text-anchor="middle">𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖭒.𖭒m + 𖬍𖬩𖬵 𖬆𖬲𖬟𖬰</text>
  <text x="99" y="162" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#475569" text-anchor="middle">𖬃𖬰𖬝𖬰 𖬆𖬰𖬪𖬵 𖬒𖬪𖬵 𖬒𖬶𖬣 𖬑𖬶𖬦</text>

  <rect x="12" y="240" width="174" height="202" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="240" width="174" height="24" rx="6" fill="#DC2626"/>
  <text x="100" y="256" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">🚫 𖬗𖬰𖬢𖬰 𖬄𖬲𖬟 𖬖𖬰𖬟𖬰 𖬗𖬮𖬰</text>
  <text x="20" y="278" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬓𖬥𖬰 𖬀𖬶𖬤 𖬗𖬣𖬰 𖬀𖬲𖬟</text>
  <text x="20" y="295" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬂𖬝𖬰 𖬉𖬝𖬰 𖬄𖬤𖬵 𖬗𖬰𖬢𖬰</text>
  <text x="20" y="312" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬌𖬪𖬵 𖬀𖬲𖬪𖬵, 𖬒𖬰𖬦 𖬃𖬰𖬝𖬰 𖬍𖬥𖬰</text>
  <rect x="18" y="325" width="162" height="48" rx="4" fill="#FEE2E2"/>
  <text x="99" y="340" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.2" fill="#B91C1C" text-anchor="middle">𖭓 𖬄𖬶 𖬐𖬡 𖬓𖬰𖬩𖬰:</text>
  <text x="24" y="354" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#7F1D1D">𖭑. 𖬂𖬶𖬝𖬰 𖬒𖬰𖬪𖬵 𖬗𖬰𖬦𖬰 𖬎𖬰𖬧𖬵</text>
  <text x="24" y="366" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#7F1D1D">𖭒. 𖬎𖬩𖬰 𖬗𖬮𖬰 𖭑.𖭕m 𖬗𖬪𖬰 𖭔𖭙 𖬆𖬰𖬩</text>

