
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="cemeteryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- TOP TITLE HUD BAR -->
  <rect x="0" y="0" width="800" height="42" fill="#0F172A"/>
  <rect x="18" y="9" width="95" height="24" rx="4" fill="#DC2626"/>
  <text x="65" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">ENV-0001-B</text>
  <text x="122" y="26" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10.8" fill="#F8FAFC">𖬄𖬲𖬦𖬵 𖭒: 𖬗𖬪𖬰 𖬗𖬰𖬢𖬰 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮 (𖬖𖬲𖬤𖬵 𖬒𖬶𖬝𖬰 𖬎𖬞𖬰) - 𖬓𖬥𖬰 𖬀𖬶𖬤 𖬒𖬶𖬝𖬰 𖬂𖬲𖬣 𖬄𖬶𖬤𖬰</text>
  <rect x="580" y="9" width="105" height="24" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="632" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8" text-anchor="middle">𖬓𖬥𖬰 𖬀𖬶𖬤 Sha</text>
  <rect x="692" y="9" width="90" height="24" rx="4" fill="#991B1B"/>
  <text x="737" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10.5" fill="#FEF2F2" text-anchor="middle">𖬀𖬶𖬯 𖬖𖬰𖬞</text>

  <!-- LEFT COLUMN CARDS -->
  <rect x="12" y="48" width="174" height="185" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="48" width="174" height="24" rx="6" fill="#475569"/>
  <text x="100" y="64" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">🐅 𖬗𖬪𖬰 𖬗𖬰𖬢𖬰 𖬖𖬲𖬤𖬵 𖬒𖬶𖬝𖬰 𖬎𖬞𖬰</text>
  <text x="20" y="86" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#1E293B">• 𖬗𖬰𖬢𖬰 𖬒𖬰𖬮𖬵 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮 𖬎𖬰𖬩𖬵 𖬗𖬮𖬰</text>
  <text x="20" y="103" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#1E293B">• 𖬖𖬲𖬤𖬵 𖬒𖬶𖬝𖬰: 𖬓𖬥𖬰 𖬀𖬶𖬤, 𖬘𖬲𖬝𖬰 𖬒𖬲𖬪𖬵 𖬔𖬰𖬬</text>
  <text x="20" y="120" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#1E293B">• 𖬐𖬰𖬦 𖬗𖬰𖬢𖬰: 𖬓𖬥𖬰 𖬀𖬶𖬤 𖬐𖬶𖬦 𖬒𖬰𖬮𖬰 𖬅𖬲𖬨𖬵</text>
  <text x="20" y="137" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬒𖬶𖬝𖬰 𖬂𖬲𖬣 𖬄𖬶𖬤𖬰: 𖬄𖬲𖬟 𖬉𖬝𖬰 𖬂𖬲𖬤𖬵 𖬉𖬶𖬯</text>
  <rect x="18" y="148" width="162" height="42" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="99" y="162" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.2" fill="#0F172A" text-anchor="middle">𖬒𖬲𖬪𖬵 𖬔𖬰𖬬 𖬀𖬰𖬝𖬵 𖬅𖬲𖬡 𖬒𖬰𖬦/𖬋𖬰𖬝𖬵</text>
  <text x="99" y="178" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#475569" text-anchor="middle">𖬖𖬲𖬤𖬵 𖬃𖬰𖬮 𖬐𖬲𖬤 𖬆𖬝𖬰 𖬒𖬰𖬮𖬵 𖬕𖬲𖬝 𖬓𖬰𖬧𖬵</text>

  <rect x="12" y="240" width="174" height="202" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="240" width="174" height="24" rx="6" fill="#DC2626"/>
  <text x="100" y="256" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">🚫 𖬒𖬶𖬯 𖬇𖬰𖬞 𖬙𖬯𖬵 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮</text>
  <text x="20" y="278" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬓𖬰𖬝𖬰 𖬐𖬶𖬪𖬰 𖬒𖬶𖬜𖬰 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮</text>
  <text x="20" y="295" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬎𖬩𖬰 𖬗𖬲𖬪𖬵 𖬈𖬲𖬞𖬰 𖬗𖬯𖬵 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮</text>
  <text x="20" y="312" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#991B1B">• 𖬙𖬯𖬵 𖬂𖬲𖬣 𖬒𖬶𖬣 𖬋𖬡 𖬒𖬲𖬞 𖬕𖬝 𖬗𖬰𖬢𖬰</text>
  <rect x="18" y="325" width="162" height="48" rx="4" fill="#FEE2E2"/>
  <text x="99" y="340" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.2" fill="#B91C1C" text-anchor="middle">𖬙𖬝𖬰 𖬂𖬤 𖬖𖬲𖬤𖬵 𖬒𖬶𖬝𖬰:</text>
  <text x="24" y="354" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#7F1D1D">• 𖬖𖬲𖬤𖬵 𖬒𖬶𖬝𖬰 𖬗𖬮 𖬅𖬧𖬵 𖬉 𖬕𖬲𖬝 𖬓𖬰𖬧𖬵</text>
  <text x="24" y="366" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#7F1D1D">• 𖬃𖬰𖬝𖬰 𖬎𖬦𖬰 = 𖬓𖬥𖬰 𖬀𖬶𖬤 𖬒𖬰𖬮𖬵 twjywm</text>

  <!-- CENTER SITE PLAN (X=195 to 605, Y=48 to 442) -->
  <g id="centerSite">
    <!-- Our Property Perimeter Ground -->
