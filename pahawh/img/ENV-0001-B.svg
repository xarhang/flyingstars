    <text x="455" y="123" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="6.5" fill="#166534" text-anchor="end">✓ 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖭒.𖭒m + 𖬒𖬲𖬜𖬰 𖬐𖬶𖬝 + 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬊𖬲𖬟𖬰</text>

    <!-- Ming Tang Lawn In Front-Left -->
    <rect x="230" y="270" width="220" height="95" rx="5" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="340" y="295" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="8" fill="#15803D" text-anchor="middle">𖬖𖬰𖬟𖬰 𖬗𖬪𖬰 𖬖𖬰 𖬈𖬪𖬵 𖬖𖬲𖬤𖬵 𖬖𖬰𖬥𖬰</text>
    <text x="340" y="312" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#166534" text-anchor="middle">✓ 𖬅𖬤𖬵 𖬓𖬥𖬰 Sheng 𖬃𖬦𖬵 &amp; 𖬉 𖬕𖬲𖬝 𖬓𖬰𖬧𖬵</text>
    <text x="340" y="328" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#0284C7" text-anchor="middle">• 𖬖𖬲𖬤𖬵 𖬒𖬶𖬝𖬰 𖬒𖬰𖬮𖬵 𖬕𖬲𖬝 𖬓𖬰𖬧𖬵 𖭑𖭐𖭐%</text>

    <!-- Neighbor Land on Right (Exterior Graves) -->
    <rect x="533" y="48" width="72" height="348" fill="url(#cemeteryGrad)" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="569" y="65" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7" fill="#475569" text-anchor="middle">𖬑𖬶𖬞 𖬗𖬮𖬰</text>
    <text x="569" y="76" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="6" fill="#DC2626" text-anchor="middle">⛔ 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬒𖬶</text>
    <text x="569" y="87" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6" fill="#475569" text-anchor="middle">(𖬗𖬪𖬰 𖬗𖬰𖬢𖬰)</text>

    <!-- Tombs in Right Neighbor Land -->
    <path d="M 552 130 A 15 12 0 0 1 587 130 Z" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>
    <rect x="565" y="110" width="8" height="12" fill="#64748B" rx="1"/>

    <path d="M 550 210 A 15 12 0 0 1 585 210 Z" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>
    <rect x="563" y="190" width="8" height="12" fill="#64748B" rx="1"/>

    <path d="M 552 290 A 15 12 0 0 1 587 290 Z" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>
    <rect x="565" y="270" width="8" height="12" fill="#64748B" rx="1"/>

    <path d="M 550 360 A 15 12 0 0 1 585 360 Z" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>
    <rect x="563" y="342" width="8" height="12" fill="#64748B" rx="1"/>

    <!-- Cold Yin Qi arrows pushing left into our wall -->
    <path d="M 550 145 L 535 145" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,2"/>
    <polygon points="532,145 538,142 538,148" fill="#38BDF8"/>
    <path d="M 550 225 L 535 225" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,2"/>
    <polygon points="532,225 538,222 538,228" fill="#38BDF8"/>
    <path d="M 550 305 L 535 305" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,2"/>
    <polygon points="532,305 538,302 538,308" fill="#38BDF8"/>

    <!-- Front Road -->
    <rect x="195" y="400" width="410" height="25" fill="#334155"/>
    <line x1="195" y1="412" x2="605" y2="412" stroke="#FBBF24" stroke-width="2" stroke-dasharray="8,6"/>
    <text x="400" y="420" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.5" fill="#FFFFFF" text-anchor="middle">𖬉 𖬒𖬲𖬞 𖬈𖬪𖬵 𖬄𖬲𖬟 𖬈𖬲𖬩𖬵</text>

    <!-- Entrance Gate (Front-Left Green Dragon Safe Zone) -->
    <rect x="290" y="396" width="35" height="8" rx="1.5" fill="#15803D"/>
    <text x="307" y="402" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="5.5" fill="#FFFFFF" text-anchor="middle">𖬌𖬲𖬡 𖬗𖬶𖬜</text>
  </g>

  <!-- RIGHT COLUMN CARDS -->
  <rect x="614" y="48" width="174" height="185" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="48" width="174" height="24" rx="6" fill="#15803D"/>
  <text x="701" y="64" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="8.8" fill="#FFFFFF" text-anchor="middle">🛡️ 𖭔 𖬒𖬲𖬯𖬵 𖬉 𖬓𖬰𖬩𖬰 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮</text>
  <text x="622" y="86" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#14532D">𖭑. 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖬐𖬶𖬧𖬵 𖭒.𖭒m 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮</text>
  <text x="622" y="103" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#14532D">𖭒. 𖬓𖬯 𖬒𖬲𖬜𖬰 𖬐𖬶𖬝 𖬐𖬶𖬧𖬵 𖬊𖬲𖬟𖬰</text>
  <text x="622" y="120" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#14532D">𖭓. 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬊𖬲𖬟𖬰 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮</text>
  <text x="622" y="137" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#14532D">𖭔. 𖬕𖬯 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮 𖬕𖬲𖬝 𖬓𖬰𖬧𖬵 𖭑𖭐𖭐%</text>
  <rect x="620" y="148" width="162" height="30" rx="3" fill="#DCFCE7"/>
  <text x="701" y="161" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="6.8" fill="#166534" text-anchor="middle">𖬒𖬲𖬯𖬵 𖬋𖬯: 𖬕𖬲𖬝 𖬓𖬰𖬧𖬵 - 𖬄𖬢 - 𖬊𖬲𖬟𖬰</text>
  <text x="701" y="172" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.2" fill="#14532D" text-anchor="middle">𖬃𖬰𖬝𖬰 𖬎𖬦𖬰 𖬒𖬶𖬝𖬰, 𖬀𖬶𖬤 𖬒𖬰𖬮𖬵 twjywm</text>

  <rect x="614" y="240" width="174" height="202" rx="6" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="240" width="174" height="24" rx="6" fill="#7E22CE"/>
  <text x="701" y="256" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="8.8" fill="#FFFFFF" text-anchor="middle">📐 𖬉 𖬀𖬶𖬧𖬵 𖬆𖬰𖬞 𖬉𖬝𖬰</text>
  <text x="622" y="278" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#581C87">• 𖬂𖬟𖬰 𖬉𖬝𖬰 𖬈𖬰𖬞𖬰 𖬔𖬰𖬯 𖬗𖬮𖬰 >𖭘-𖭑𖭒m</text>
  <text x="622" y="295" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#581C87">• 𖬓𖬰𖬝𖬰 𖬉𖬝𖬰 𖬅𖬡 𖬐𖬶𖬜𖬰 𖬖𖬲𖬜𖬰-𖬅𖬲𖬞</text>
  <text x="622" y="312" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#581C87">• 𖬖𖬰𖬜 𖬕𖬲𖬝 𖬓𖬰𖬧𖬵 𖬅𖬡 𖬖𖬲𖬤𖬵 𖬒𖬶𖬝𖬰</text>
  <rect x="620" y="325" width="162" height="48" rx="3" fill="#F3E8FF"/>
  <text x="701" y="339" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7" fill="#6B21A8" text-anchor="middle">𖬒𖬶𖬣 𖬌𖬲𖬡 𖬗𖬶𖬜 𖬗𖬶𖬢 𖬉𖬝𖬰:</text>
  <text x="701" y="352" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#581C87" text-anchor="middle">𖬂𖬲𖬣 𖬈𖬪𖬵 𖬖𖬲𖬤𖬵 𖬅𖬲𖬞 (𖬖𖬲𖬤𖬵 𖬖𖬰𖬥𖬰)</text>
  <text x="701" y="364" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.2" fill="#7E22CE" text-anchor="middle">𖬙𖬯𖬵 𖬂𖬲𖬣 𖬌𖬲𖬡 𖬗𖬶𖬜 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮</text>

  <!-- BOTTOM SUMMARY BAR -->
  <rect x="0" y="445" width="800" height="35" fill="#0F172A"/>
  <text x="400" y="460" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.5" fill="#F8FAFC" text-anchor="middle">𖬙𖬝𖬰 𖬂𖬤: 𖬗𖬰𖬢𖬰 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮 𖬑𖬮𖬰 𖬅𖬡 𖬓𖬥𖬰 𖬀𖬶𖬤 𖬒𖬰𖬮𖬰 𖬅𖬲𖬨𖬵, 𖬉𖬝𖬰 𖬁𖬲𖬬 𖬀𖬰𖬝𖬵 𖬂𖬲𖬤𖬵 𖬉𖬶𖬯 𖬔𖬟𖬰 𖬒𖬲𖬪𖬵 𖬔𖬰𖬬 𖬒𖬰𖬦 𖬁𖬲𖬢.</text>
  <text x="400" y="472" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#94A3B8" text-anchor="middle">𖬉 𖬓𖬰𖬩𖬰: 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖬐𖬶𖬧𖬵 𖭒.𖭒m + 𖬒𖬲𖬜𖬰 𖬐𖬶𖬝 𖬊𖬲𖬟𖬰 + 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬊𖬲𖬟𖬰 + 𖬕𖬯 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮 𖬒𖬰𖬮𖬵 𖬕𖬲𖬝 𖬓𖬰𖬧𖬵 𖬃𖬰𖬝𖬰 𖬆𖬰𖬪𖬵 𖬒𖬶𖬜𖬰.</text>
