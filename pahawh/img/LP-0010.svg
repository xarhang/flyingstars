  <text x="577" y="25" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8" text-anchor="middle">𖬓𖬥𖬰 𖬗𖬮𖬰 𖬍𖬝𖬰 (𖬓𖬥𖬰 𖬗𖬮𖬰 𖬄𖬶𖬡 Sha)</text>

