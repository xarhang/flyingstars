  <text x="700" y="222" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬙𖬝𖬰 𖬂𖬤 𖬓𖬰𖬩𖬰 &amp; 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬆𖬰𖬪𖬵</text>
  <text x="622" y="246" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#6B21A8">𖭑. 𖬓𖬯 𖬒𖬰𖬝𖬰 𖬍𖬩𖬵 𖬐𖬶𖬝 𖬑𖬶𖬪𖬵 𖬃𖬲𖬤𖬰 𖬖𖬰𖬯 𖬖𖬲𖬞𖬰</text>
  <text x="622" y="266" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#6B21A8">𖭒. 𖬗𖬲𖬪𖬵 𖬈𖬲𖬞𖬰 𖬒𖬲𖬜 𖬀𖬰𖬩𖬰 𖬈𖬪𖬵 𖬄𖬲𖬟 𖬈𖬲𖬩𖬵</text>
  <text x="622" y="286" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#6B21A8">𖭓. 𖬓𖬰𖬝𖬰 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵 𖬉𖬝𖬰</text>
  <text x="622" y="306" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#6B21A8">𖭔. 𖬑𖬮𖬰 𖬖𖬰𖬞 𖬖𖬲 𖬐𖬰𖬡 𖬒𖬶𖬩𖬰 𖬀𖬲𖬯 𖬓𖬥𖬰</text>

  <rect x="620" y="326" width="162" height="106" rx="4" fill="#F3E8FF"/>
  <text x="700" y="342" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="8" fill="#7E22CE" text-anchor="middle">𖬒𖬶𖬯 𖬇𖬰𖬞 𖬙𖬯𖬵 (𖬒𖬶𖬯 𖬇𖬰𖬞 𖬙𖬯𖬵)</text>
  <text x="626" y="360" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#9333EA">• 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬆𖬰𖬪𖬵 𖬔𖬲𖬯𖬵 𖬌𖬲𖬡 𖬖𖬲𖬦𖬵 𖬎𖬰𖬧𖬵</text>
  <text x="626" y="377" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#9333EA">• 𖬙𖬯𖬵 𖬓𖬰𖬝𖬰 𖬒𖬶𖬣 𖬆𖬰𖬯 𖬅𖬡 𖬖𖬰𖬯 𖬖𖬲𖬞𖬰</text>
  <text x="626" y="394" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#9333EA">• 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬆𖬰𖬪𖬵 𖬖𖬰𖬯 𖬖𖬲𖬞𖬰 𖬊𖬬𖬰 𖬅𖬞𖬵</text>
  <text x="700" y="418" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7" fill="#7E22CE" text-anchor="middle">✓ 𖬆𖬲𖬟 𖬃𖬤𖬵 &amp; 𖬀𖬶𖬧𖬵 𖬒𖬪𖬵 𖬉 𖬍𖬥𖬰</text>

