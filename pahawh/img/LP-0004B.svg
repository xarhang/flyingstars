  <text x="622" y="88" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#0369A1">• 𖬏𖬧: 𖬐𖬶𖬜𖬰 𖬖𖬲𖬜𖬰 𖬗𖬧 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵 𖬒𖬲𖬞</text>
  <text x="622" y="108" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#0369A1">• 𖬒𖬶𖬣 𖬈𖬰𖬞𖬰: 𖬗𖬧 𖬈𖬪𖬵 𖬑𖬮𖬰 𖬖𖬰𖬜 𖬋𖬰𖬯𖬵 𖬑𖬣</text>
  <text x="622" y="128" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#0369A1">• 𖬕𖬝 (𖬕𖬝): 𖬕𖬝 𖬅𖬞𖬵 𖬖𖬰𖬯 𖬖𖬲𖬞𖬰 𖬅𖬡 𖬈𖬪𖬵 𖬄𖬲𖬟 𖬈𖬲𖬩𖬵</text>
  <text x="622" y="148" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#0369A1">• 𖬄𖬥𖬰 (𖬄𖬥𖬰): 𖬄𖬥𖬰 𖬄𖬰𖬜𖬰 𖬄𖬦𖬵 𖬇𖬟 𖬇𖬞 𖬐𖬰𖬡 𖬒𖬶𖬩𖬰</text>
  
  <rect x="620" y="158" width="162" height="34" rx="4" fill="#E0F2FE"/>
