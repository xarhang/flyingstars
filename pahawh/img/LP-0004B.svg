  <text x="100" y="64" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬒𖬶𖬣 𖬌𖬲𖬡 &amp; 𖬖𖬰𖬟𖬰 𖬗𖬪𖬰</text>
  <text x="20" y="88" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#14532D">• 𖬒𖬶𖬣 𖬌𖬲𖬡 𖬗𖬶𖬜: 𖬄𖬶𖬤𖬰 𖬄𖬰𖬧𖬵 𖬈𖬪𖬵 𖬈𖬲𖬩𖬵 𖬅𖬤𖬵 𖬓𖬥𖬰</text>
  <text x="20" y="108" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#14532D">• 𖬉 𖬈𖬰𖬪𖬰: 𖬅𖬰𖬫𖬵 𖬓𖬲𖬦 𖬑𖬶𖬦 𖬅𖬞𖬵 𖬖𖬰𖬯 𖬖𖬲𖬞𖬰 𖬅𖬡 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵</text>
  <text x="20" y="128" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#14532D">• 𖬖𖬰𖬟𖬰 𖬗𖬪𖬰: 𖬗𖬧 𖬈𖬪𖬵 𖬆𖬲𖬟 𖬃𖬤𖬵 𖬂𖬞 𖬐𖬶𖬟 𖬑𖬯</text>
  <text x="20" y="148" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#14532D">• 𖬗𖬲𖬪𖬵 𖬈𖬲𖬞𖬰: 𖬈𖬲𖬞𖬰 𖬔𖬯𖬰 𖬑𖬶𖬪𖬵 𖬃𖬲𖬤𖬰 𖬒𖬲𖬜 𖬀𖬰𖬩𖬰</text>
  
  <rect x="18" y="158" width="162" height="34" rx="4" fill="#DCFCE7"/>
  <text x="100" y="171" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.5" fill="#15803D" text-anchor="middle">𖬄𖬶𖬤𖬰 𖬇𖬟 𖬇𖬞: 𖬅𖬤𖬵 𖬌 𖬍𖬰𖬣𖬵 Sheng 𖬃𖬦𖬵 𖬒𖬲𖬞</text>
  <text x="100" y="184" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7" fill="#166534" text-anchor="middle">✓ 𖬖𖬰𖬯 𖬖𖬲𖬞𖬰 𖬄𖬲𖬮 𖬓𖬥𖬰: 𖬃𖬰𖬝𖬰 𖬆𖬰𖬪𖬵 𖬔𖬶𖬮𖬵 𖬕𖬲𖬯𖬵 𖬅𖬮</text>

