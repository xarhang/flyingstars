    <text x="435" y="186" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7" fill="#475569" text-anchor="middle">𖬕𖬝 𖬅𖬡 𖬗𖬪𖬰 𖬖𖬰 &amp; 𖬈𖬲𖬞𖬰</text>
