  <!-- RIGHT COLUMN CARDS -->
  <rect x="614" y="48" width="174" height="185" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="48" width="174" height="24" rx="6" fill="#DC2626"/>
  <text x="701" y="64" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="8.8" fill="#FFFFFF" text-anchor="middle">🚫 𖭔 𖬖𖬤 𖬙𖬯𖬵 𖬓𖬯𖬵 𖬈𖬲𖬞𖬰</text>
  <text x="622" y="86" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#991B1B">𖭑. 𖬙𖬯𖬵 𖬗𖬲𖬪𖬵 𖬈𖬲𖬞𖬰 𖬒𖬲𖬞 𖬊𖬲𖬟𖬰 𖬉</text>
  <text x="628" y="99" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#7F1D1D">(Shui 𖬗𖬰𖬞𖬰 Chen She)</text>
  <text x="622" y="115" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#991B1B">𖭒. 𖬙𖬯𖬵 𖬈𖬲𖬞𖬰 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮 (𖬖𖬲𖬤𖬵 𖬒𖬶𖬝𖬰)</text>
  <text x="628" y="128" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#7F1D1D">(Bai 𖬇𖬟 Zhang Kou)</text>
  <text x="622" y="144" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#991B1B">𖭓. 𖬙𖬯𖬵 𖬈𖬲𖬞𖬰 𖬄 𖬉𖬰𖬝</text>
  <text x="628" y="157" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#7F1D1D">(Shui Huo 𖬕𖬝 Chong)</text>
  <text x="622" y="173" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#991B1B">𖭔. 𖬙𖬯𖬵 𖬈𖬲𖬞𖬰 𖬙𖬰𖬝𖬰 𖬘𖬲𖬞 (𖬈𖬲𖬞𖬰 𖬑𖬶𖬧𖬵)</text>

  <rect x="614" y="240" width="174" height="202" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="240" width="174" height="24" rx="6" fill="#334155"/>
  <text x="701" y="256" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="8.8" fill="#FFFFFF" text-anchor="middle">💡 𖬙𖬝𖬰 𖬂𖬤 𖬍𖬥𖬰 𖬖𖬰𖬪𖬰</text>
  <text x="622" y="280" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#0F172A">• 𖬉𖬝𖬰 𖬒𖬰𖬮𖬵: 𖬃𖬰𖬝𖬰 𖬗𖬲𖬧𖬵 𖬂𖬝𖬰 𖬗𖬲𖬪𖬵 𖬈𖬲𖬞𖬰</text>
  <text x="622" y="297" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#0F172A">• 𖬌𖬧𖬰 𖬐𖬶𖬝 = 𖬖𖬲𖬮𖬵 𖬀𖬶𖬮 &amp; Ju 𖬃𖬦𖬵</text>
  <text x="622" y="314" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#0F172A">• 𖬓𖬤 𖬔𖬰𖬮𖬵: 𖬑𖬮𖬰 𖬗𖬲𖬪𖬵 𖬈𖬲𖬞𖬰 𖬀𖬰𖬩𖬰 𖬉𖬰𖬦</text>
  <rect x="620" y="328" width="162" height="46" rx="3" fill="#E2E8F0"/>
  <text x="701" y="343" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="6.8" fill="#1E293B" text-anchor="middle">𖬖𖬰𖬥𖬰 𖬅𖬧𖬵 𖬈𖬲𖬞𖬰 (Qing Long 𖬉𖬰𖬞𖬰 Shui)</text>
  <text x="701" y="356" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.2" fill="#475569" text-anchor="middle">𖬈𖬲𖬞𖬰 𖬒𖬰𖬮𖬵 𖬖𖬲𖬤𖬵 𖬅𖬲𖬞 𖬎𖬦𖬰 𖬓𖬥𖬰</text>
  <text x="701" y="367" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6" fill="#334155" text-anchor="middle">𖬃𖬰𖬝𖬰 𖬊𖬲𖬟𖬰 𖬉 𖬗𖬶𖬢 𖬉𖬝𖬰</text>

  <!-- BOTTOM SUMMARY BAR -->
  <rect x="0" y="445" width="800" height="35" fill="#0F172A"/>
  <text x="400" y="460" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.5" fill="#F8FAFC" text-anchor="middle">𖬙𖬝𖬰 𖬂𖬤: 𖬇𖬰𖬧𖬵 𖬈𖬲𖬞𖬰 𖬖𖬲𖬤𖬵 𖬄𖬲𖬜𖬰 𖬓𖬤 𖬑𖬶𖬪𖬵 𖬃𖬲𖬤𖬰 (𖬂𖬶𖬤𖬵 𖬎𖬶𖬧𖬵 𖬆𖬰) 𖬐𖬲𖬤 𖬑𖬫𖬰 𖬕𖬰𖬦, 𖬓𖬤 𖬑𖬧𖬵 𖬒𖬶𖬡 𖬖𖬲𖬦𖬵 𖬐𖬲𖬤 𖬆𖬝𖬰 𖬂𖬝𖬰 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖬊𖬲𖬟𖬰.</text>
  <text x="400" y="472" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#94A3B8" text-anchor="middle">𖬗𖬲𖬪𖬵 𖬈𖬲𖬞𖬰 𖬄𖬲𖬟 𖬗𖬮𖬰: 𖬃𖬰𖬝𖬰 𖬐𖬰𖬦 𖬈𖬲𖬞𖬰 𖬑𖬮𖬰 𖬗𖬪𖬰 𖬐𖬶𖬝 = 𖬍𖬥𖬰 𖬖𖬰𖬪𖬰. 𖬓𖬤 𖬐𖬰𖬦 𖬓𖬰𖬝𖬰 𖬖𖬲𖬤𖬵 𖬖𖬰𖬥𖬰 𖭑𖭐-𖭑𖭕%, 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬊𖬲𖬟𖬰 𖬉 𖬔𖬟𖬰 𖬙𖬯𖬵 𖬖𖬲𖬤𖬵 𖬒𖬶𖬝𖬰.</text>
