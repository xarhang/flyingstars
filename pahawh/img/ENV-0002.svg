    <text x="435" y="246" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7" fill="#166534" text-anchor="middle">✓ 𖬃𖬰𖬝𖬰 𖬐𖬰𖬦 𖬈𖬲𖬞𖬰 (𖬍𖬥𖬰 𖬖𖬰𖬪𖬰): 𖬗𖬪𖬰 𖬌𖬧𖬰</text>
    <text x="435" y="258" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.2" fill="#475569" text-anchor="middle">𖬖𖬲𖬮𖬵 𖬀𖬶𖬮, 𖬃𖬰𖬝𖬰 𖬆𖬰𖬩𖬵, 𖬃𖬰𖬝𖬰 𖬐𖬰𖬦 𖬍𖬰𖬤</text>

