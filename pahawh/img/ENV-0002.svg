
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- TOP TITLE HUD BAR -->
  <rect x="0" y="0" width="800" height="42" fill="#0F172A"/>
  <rect x="18" y="9" width="80" height="24" rx="4" fill="#0284C7"/>
  <text x="58" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">ENV-0002</text>
  <text x="108" y="26" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="11" fill="#F8FAFC">𖬀𖬰𖬦𖬰 𖬀𖬦𖬰 𖬈𖬲𖬞𖬰: 𖬗𖬲𖬪𖬵 𖬈𖬲𖬞𖬰 𖬄𖬲𖬟 𖬗𖬮𖬰 vs 𖬇𖬰𖬧𖬵 𖬈𖬲𖬞𖬰 𖬖𖬲𖬤𖬵 𖬄𖬲𖬜𖬰 (𖬈𖬲𖬞𖬰 Masterclass)</text>
  <rect x="580" y="9" width="105" height="24" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="632" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8" text-anchor="middle">𖬓𖬥𖬰 𖬈𖬲𖬞𖬰 / 𖬈𖬲𖬞𖬰</text>
  <rect x="692" y="9" width="90" height="24" rx="4" fill="#15803D"/>
  <text x="737" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10.5" fill="#FEF2F2" text-anchor="middle">𖬑𖬮𖬰 𖬒 𖬗𖬶𖬧𖬵</text>

  <!-- LEFT COLUMN CARDS -->
  <rect x="12" y="48" width="174" height="185" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="48" width="174" height="24" rx="6" fill="#0284C7"/>
  <text x="100" y="64" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">🌊 𖬇𖬰𖬧𖬵 𖬈𖬲𖬞𖬰 𖬒𖬲𖬞 𖬖𖬲𖬤𖬵 𖬄𖬲𖬜𖬰</text>
  <text x="20" y="86" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#0369A1">• 𖬓𖬤 𖬇𖬰𖬧𖬵 𖬖𖬰𖬥𖬰 𖬈𖬲𖬞𖬰 𖬒𖬲𖬞 𖬎𖬰𖬩𖬵 𖬆𖬶𖬩𖬵</text>
  <text x="20" y="103" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.8" fill="#15803D">✓ 𖬂𖬶𖬤𖬵 𖬎𖬶𖬧𖬵 𖬆𖬰: 𖬑𖬶𖬪𖬵 𖬃𖬲𖬤𖬰 𖬉𖬝𖬰</text>
  <text x="26" y="117" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#166534">→ 𖬅𖬤𖬵 𖬔𖬶𖬮𖬵 𖬕𖬲𖬯𖬵, 𖬍𖬥𖬰 𖬔𖬤𖬵</text>
  <text x="20" y="134" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.8" fill="#DC2626">✗ Reverse Bow: 𖬅𖬰𖬫𖬵 𖬑𖬧𖬵 𖬅𖬡 𖬉𖬝𖬰</text>
  <text x="26" y="148" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#991B1B">→ 𖬌𖬪𖬵 𖬀𖬲𖬪𖬵, 𖬅𖬲𖬡 𖬄𖬰𖬟𖬵</text>
  <rect x="18" y="156" width="162" height="24" rx="3" fill="#E0F2FE"/>
  <text x="99" y="172" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#0369A1" text-anchor="middle">𖬓𖬰𖬩𖬰: 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖬒𖬰𖬪𖬵 𖬈𖬰𖬥𖬰 + 𖬍𖬩𖬵</text>

  <rect x="12" y="240" width="174" height="202" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="240" width="174" height="24" rx="6" fill="#15803D"/>
  <text x="100" y="256" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">🏞️ 𖬗𖬲𖬪𖬵 𖬈𖬲𖬞𖬰 𖬄𖬲𖬟 𖬗𖬮𖬰</text>
  <text x="20" y="278" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.8" fill="#15803D">✓ 𖬃𖬰𖬝𖬰 𖬐𖬰𖬦 𖬈𖬲𖬞𖬰 = 𖬍𖬥𖬰 𖬖𖬰𖬪𖬰 𖭑𖭐𖭐%</text>
  <text x="26" y="292" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.8" fill="#166534">→ 𖬗𖬪𖬰 𖬌𖬧𖬰 𖬐𖬶𖬝 𖬖𖬰 𖬋𖬰𖬯𖬵 𖬀𖬶𖬧𖬵</text>
  <text x="20" y="309" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#0369A1">• 𖬓𖬤 𖬐𖬰𖬦: 𖬓𖬰𖬝𖬰 𖬖𖬲𖬤𖬵 𖬖𖬰𖬥𖬰 𖭑𖭐-𖭑𖭕%</text>
  <text x="20" y="326" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.8" fill="#0369A1">• 𖬈𖬲𖬞𖬰 𖬆𖬲𖬟 𖬔𖬟𖬰 𖬙𖬲𖬩𖬵 𖬗𖬲𖬧𖬵 𖬃𖬞</text>
  <rect x="18" y="338" width="162" height="52" rx="3" fill="#DCFCE7"/>
  <text x="99" y="352" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7" fill="#14532D" text-anchor="middle">Golden Ratio:</text>
  <text x="24" y="366" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#166534">• 𖬒𖬶𖬣 𖬒𖬲𖬞: 𖭑𖭐-𖭑𖭕% 𖬎𖬰𖬩𖬵 𖬗𖬪𖬰</text>
  <text x="24" y="378" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="6.5" fill="#166534">• 𖬒𖬶𖬣 𖬒𖬰𖬧𖬵: 𖭓𖭐-𖭕𖭐cm 𖬘𖬰𖬮</text>

