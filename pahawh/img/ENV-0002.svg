    <text x="547" y="152" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="5.8" fill="#FEE2E2" text-anchor="middle">𖬈𖬲𖬞𖬰 𖬑𖬧𖬵 𖬅𖬡 𖬖𖬲𖬤𖬵 𖬄𖬲𖬜𖬰</text>

