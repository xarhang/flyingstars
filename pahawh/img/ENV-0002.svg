      <line x1="8" y1="8" x2="32" y2="32" stroke="#DC2626" stroke-width="2"/>
      <line x1="32" y1="8" x2="8" y2="32" stroke="#DC2626" stroke-width="2"/>
      <text x="20" y="44" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="6.5" fill="#DC2626" text-anchor="middle">🚫 𖬙𖬯𖬵 𖬈𖬲𖬞𖬰 𖬖𖬲𖬤𖬵 𖬒𖬶𖬝𖬰</text>
      <text x="20" y="54" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="5.8" fill="#991B1B" text-anchor="middle">(𖬒𖬶𖬝𖬰 𖬂𖬲𖬣 𖬄𖬶𖬤𖬰)</text>
