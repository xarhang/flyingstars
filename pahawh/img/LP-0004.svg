  <text x="96" y="26" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10" fill="#F8FAFC">𖬖𖬰𖬟𖬰 𖬗𖬮𖬰 𖬆𖬰𖬞 𖬄𖬰𖬧𖬵 (𖬖𖬰𖬟𖬰 𖬗𖬮𖬰 𖬇𖬟 𖬇𖬞 - 𖬖𖬰𖬟𖬰 𖬗𖬮𖬰 𖬆𖬰𖬞 𖬄𖬰𖬧𖬵)</text>
  
