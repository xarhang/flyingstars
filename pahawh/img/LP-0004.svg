  <text x="577" y="25" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8" text-anchor="middle">𖬓𖬥𖬰 𖬈𖬲𖬞𖬰/𖬆𖬰 (𖬈𖬲𖬞𖬰/𖬆𖬰)</text>

