  <text x="700" y="64" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬏𖬧 𖬓𖬰𖬝𖬰 𖬉𖬝𖬰 &amp; 𖬗𖬪𖬰</text>
  <text x="622" y="88" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#0369A1">• 𖬏𖬧: 𖬖𖬲𖬤𖬵 𖬒𖬧𖬵 𖬖𖬲𖬦𖬵 𖭑/𖭓 𖬒𖬶𖬣 𖬒𖬰𖬧𖬵</text>
  <text x="622" y="108" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#0369A1">• 𖬒𖬶𖬣 𖬈𖬰𖬞𖬰: 𖬗𖬪𖬰 𖬈𖬪𖬵 𖬄𖬲𖬟 𖭑𖭐-𖭑𖭒m</text>
  <text x="622" y="128" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#0369A1">• 𖬕𖬝 (𖬕𖬝): 𖬕𖬝 𖬗𖬪𖬰 𖬒𖬲𖬞 𖬈𖬪𖬵</text>
