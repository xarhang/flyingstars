  <text x="20" y="246" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#78350F">• 𖬓𖬥𖬰 𖬖𖬰𖬟𖬰 𖬗𖬮𖬰: 𖬓𖬥𖬰 𖬍𖬩𖬵 (𖬍𖬩𖬵)</text>
  <text x="20" y="266" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#78350F">• ✓ 𖬄𖬟: 𖬁𖬲𖬬 𖬓𖬥𖬰 𖬍𖬩𖬵 &amp; 𖬐𖬲𖬥</text>
  <text x="20" y="286" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#78350F">(𖬑𖬠𖬵 𖭓 (𖬓𖬥𖬰 𖬍𖬩𖬵), 𖭔 (𖬓𖬥𖬰 𖬍𖬩𖬵), 𖭙 (𖬓𖬥𖬰 𖬐𖬲𖬥))</text>
  <text x="20" y="306" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#78350F">• ✗ 𖬁𖬲𖬬 𖬓𖬥𖬰 𖬗𖬮𖬰 (𖬑𖬠𖬵 𖭒, 𖭘) 𖬀𖬲𖬯 𖬖𖬰𖬜𖬵</text>
  <text x="20" y="326" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#78350F">• 𖬂𖬶𖬤𖬵 𖬀𖬶𖬧𖬵 𖬃𖬯 𖬆𖬰 &amp; 𖬂𖬮 cream 𖬓𖬰𖬩𖬰</text>
  
  <rect x="18" y="346" width="162" height="86" rx="4" fill="#FEF3C7"/>
  <text x="100" y="364" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="8" fill="#92400E" text-anchor="middle">𖬂𖬲𖬝𖬰 𖬖𖬤 𖬓𖬥𖬰: 𖬍𖬩𖬵 𖬇𖬲𖬤 𖬐𖬲𖬥</text>
  <text x="100" y="382" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#78350F" text-anchor="middle">𖬙𖬝𖬰 𖬂𖬤 𖬍𖬥𖬰, 𖬉𖬰𖬨𖬵 𖬒𖬶𖬜𖬰, 𖬖𖬜 𖬀𖬰𖬦</text>
  <text x="100" y="402" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7" fill="#B45309" text-anchor="middle">𖬂𖬲𖬝𖬰 𖬖𖬤 𖬓𖬥𖬰 &amp; 𖭘 𖬖𖬲𖬜𖬵 𖭘 𖬖𖬲𖬜𖬵</text>
  <text x="100" y="418" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7" fill="#D97706" text-anchor="middle">✓ 𖬐𖬶𖬟 𖬑𖬯 𖬂𖬲𖬤𖬵 𖬅𖬲𖬨𖬵 𖬍𖬥𖬰</text>

