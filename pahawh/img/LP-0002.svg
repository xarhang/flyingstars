  <rect x="12" y="48" width="174" height="152" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="48" width="174" height="24" rx="6" fill="#16A34A"/>
  <text x="100" y="64" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬒𖬶𖬣 𖬌𖬲𖬡 &amp; 𖬖𖬰𖬟𖬰 𖬗𖬪𖬰</text>
  <text x="20" y="88" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#14532D">• 𖬒𖬶𖬣 𖬌𖬲𖬡 𖬗𖬶𖬜: 𖬈𖬪𖬵 𖬄𖬲𖬟 𖬈𖬲𖬩𖬵 𖬖𖬲𖬤𖬵 𖬖𖬰𖬥𖬰 𖬐𖬶𖬝</text>
  <text x="20" y="108" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#14532D">• 𖬉 𖬈𖬰𖬪𖬰: 𖬅𖬰𖬫𖬵 𖬓𖬲𖬦 𖬑𖬶𖬦 (𖬉 𖬅𖬰𖬫𖬵 𖬓𖬲𖬦), 𖬙𖬯𖬵 𖬖𖬰𖬤𖬰 𖬑𖬧𖬵</text>
  <text x="20" y="128" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#14532D">• 𖬃𖬰𖬝𖬰 𖬐𖬰𖬦 𖬈𖬲𖬞𖬰: 𖬗𖬪𖬰 𖬌𖬧𖬰 𖬐𖬶𖬝 𖬖𖬰 𖬅𖬤𖬵 𖬓𖬥𖬰</text>
  <text x="20" y="148" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="8" fill="#14532D">• 𖬓𖬤 𖬐𖬰𖬦 𖬈𖬲𖬞𖬰: 𖬈𖬲𖬞𖬰 𖬔𖬯𖬰 𖬑𖬶𖬪𖬵 𖬃𖬲𖬤𖬰 𖬒𖬲𖬜 𖬀𖬰𖬩𖬰</text>
  
  <rect x="18" y="158" width="162" height="34" rx="4" fill="#DCFCE7"/>
  <text x="100" y="171" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7.5" fill="#15803D" text-anchor="middle">𖬖𖬰𖬟𖬰 𖬗𖬪𖬰 𖬖𖬰: 𖬆𖬲𖬟 𖬃𖬤𖬵 𖬅𖬤𖬵 𖬅𖬩𖬵 𖬆𖬰𖬞 𖬓𖬥𖬰</text>
  <text x="100" y="184" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7" fill="#166534" text-anchor="middle">✓ 𖬉 𖬅𖬰𖬫𖬵 𖬐𖬰𖬦 𖬔𖬤𖬵 𖬍𖬥𖬰 (𖬉 𖬅𖬰𖬫𖬵 𖬐𖬰𖬦 𖬔𖬤𖬵 𖬍𖬥𖬰)</text>

