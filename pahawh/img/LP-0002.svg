  <text x="626" y="360" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#9333EA">• 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬑𖬮𖬰 𖬉 𖬖𖬰𖬤𖬰 𖬍𖬥𖬰 𖬃𖬞 𖬒𖬝𖬵</text>
  <text x="626" y="377" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#9333EA">• 𖬙𖬯𖬵 𖬈𖬲𖬞𖬰 𖬅𖬮 𖬖𖬰𖬤𖬰 𖬎𖬰𖬧𖬵 𖬇𖬰𖬦 𖬉</text>
  <text x="626" y="394" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-size="7.5" fill="#9333EA">• 𖬙𖬯𖬵 𖬃𖬰𖬝𖬰 𖬓𖬰𖬝𖬰 𖬉𖬝𖬰 𖬉𖬰𖬥𖬰 𖬖𖬲𖬝𖬵 𖬖𖬲𖬤𖬵</text>
  <text x="700" y="418" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="7" fill="#7E22CE" text-anchor="middle">✓ 𖬆𖬲𖬟 𖬃𖬤𖬵 &amp; 𖬀𖬶𖬧𖬵 𖬒𖬪𖬵 𖬉 𖬍𖬥𖬰</text>

