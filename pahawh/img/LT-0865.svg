    <text x="32" y="458" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#0F172A">𖬉 𖬓𖬰𖬩𖬰: </tspan>𖬏𖬰𖬩𖬰 𖬕𖬯 𖬒 𖬈𖬲𖬞𖬰 𖬔𖬯𖬰 𖬆𖬲𖬟 𖬃𖬰𖬝𖬰 𖬒𖬰𖬦𖬰 𖬐𖬶𖬦 𖬂𖬲𖬩𖬰 𖬔𖬮𖬵 𖬒𖬶𖬪𖬵 𖬅𖬡 𖬄𖬲𖬟.</text>
  
