        <text x="217" y="240" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8.5" fill="#F8FAFC" text-anchor="middle" transform="rotate(-90 217 240)">&amp;#10140; 𖬒𖬲𖬯𖬵 𖬉 𖬖𖬲𖬤𖬵 𖬅𖬲𖬞 &amp;#10140;</text>

