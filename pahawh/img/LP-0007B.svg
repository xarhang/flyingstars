  <text x="726" y="25" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10.5" fill="#FEF2F2" text-anchor="middle">𖬈𖬝𖬵: 𖭓𖭘 / 𖭑𖭐𖭐</text>

  <!-- ========================================================================= -->
  <!-- LEFT COLUMN: CARDS (X=18 to 182) -->
  <!-- ========================================================================= -->

  <!-- Top-Left Card: Entrance & Driveway (Y=48 to 200) -->
  <rect x="12" y="48" width="174" height="152" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="48" width="174" height="24" rx="6" fill="#16A34A"/>
  <text x="100" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬒𖬶𖬣 𖬌𖬲𖬡 &amp; 𖬖𖬰𖬟𖬰 𖬗𖬪𖬰</text>
  <text x="20" y="88" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#14532D">• 𖬒𖬶𖬣 𖬌𖬲𖬡 𖬗𖬶𖬜: 𖬉 𖬖𖬲𖬤𖬵 𖬅𖬲𖬞, 𖬈𖬰𖬞𖬰 𖬄 𖬉𖬰𖬝 &gt;𖭑𖭕m</text>
  <text x="20" y="108" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#14532D">• 𖬉 𖬈𖬰𖬪𖬰: 𖬅𖬰𖬫𖬵 𖬓𖬲𖬦 𖬑𖬶𖬦 (𖬉 𖬅𖬰𖬫𖬵 𖬓𖬲𖬦), 𖬙𖬯𖬵 𖬖𖬰𖬤𖬰 𖬑𖬧𖬵</text>
  <text x="20" y="128" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#14532D">• 𖬃𖬰𖬝𖬰 𖬐𖬰𖬦 𖬈𖬲𖬞𖬰: 𖬗𖬪𖬰 𖬌𖬧𖬰 𖬐𖬶𖬝 𖬖𖬰 𖬅𖬤𖬵 𖬓𖬥𖬰</text>
  <text x="20" y="148" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#14532D">• 𖬓𖬤 𖬐𖬰𖬦 𖬈𖬲𖬞𖬰: 𖬈𖬲𖬞𖬰 𖬔𖬯𖬰 𖬑𖬶𖬪𖬵 𖬃𖬲𖬤𖬰 𖬒𖬲𖬜 𖬀𖬰𖬩𖬰</text>
  
  <rect x="18" y="158" width="162" height="34" rx="4" fill="#DCFCE7"/>
  <text x="100" y="171" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#15803D" text-anchor="middle">𖬖𖬰𖬟𖬰 𖬗𖬪𖬰 𖬖𖬰: 𖬆𖬲𖬟 𖬃𖬤𖬵 𖬅𖬤𖬵 𖬅𖬩𖬵 𖬆𖬰𖬞 𖬓𖬥𖬰</text>
  <text x="100" y="184" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#166534" text-anchor="middle">✓ 𖬉 𖬅𖬰𖬫𖬵 𖬐𖬰𖬦 𖬔𖬤𖬵 𖬍𖬥𖬰 (𖬉 𖬅𖬰𖬫𖬵 𖬐𖬰𖬦 𖬔𖬤𖬵 𖬍𖬥𖬰)</text>

  <!-- Bottom-Left Card: Gua & Compatibility (Y=206 to 442) -->
  <rect x="12" y="206" width="174" height="236" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="206" width="174" height="24" rx="6" fill="#D97706"/>
  <text x="100" y="222" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">𖬓𖬥𖬰 𖭘 𖬖𖬲𖬜𖬵 &amp; 𖬁𖬲𖬬 𖬄𖬟</text>
  <text x="20" y="246" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• 𖬓𖬥𖬰: 𖬐𖬲𖬥 𖬏𖬰𖬧𖬵 &amp; 𖬑𖬯</text>
  <text x="20" y="266" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• 𖬖𖬰𖬥𖬰 𖬐𖬶𖬝 𖬋𖬰𖬯𖬵 𖬓𖬥𖬰 Yang</text>
  <text x="20" y="286" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• 𖬒𖬶𖬝𖬰 𖬎𖬞𖬰 𖬕𖬲𖬝 𖬓𖬰𖬧𖬵 (𖬔𖬰𖬯 𖬑𖬶𖬞)</text>
  <text x="20" y="306" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• ✗ 𖬁𖬲𖬬 𖬓𖬥𖬰 𖬆𖬰 (𖬑𖬠𖬵 𖭖, 𖭗) 𖬀𖬲𖬯 𖬖𖬰𖬜𖬵</text>
  <text x="20" y="326" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• 𖬓𖬯 𖬍𖬩𖬵 &amp; 𖬂𖬝𖬰 𖬖𖬲𖬝𖬵 𖬗𖬰𖬝 𖬓𖬰𖬩𖬰</text>
  
  <rect x="18" y="346" width="162" height="86" rx="4" fill="#FEF3C7"/>
  <text x="100" y="364" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8" fill="#92400E" text-anchor="middle">𖬂𖬲𖬝𖬰 𖬖𖬤 𖬓𖬥𖬰 &amp; 𖭘 𖬖𖬲𖬜𖬵</text>
  <text x="100" y="382" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#78350F" text-anchor="middle">𖬐𖬲𖬥 𖬐𖬲𖬢𖬵 𖬆𖬰: 𖬂𖬶𖬤𖬵 𖬗𖬮𖬰 𖬓𖬰𖬩𖬰</text>
  <text x="100" y="402" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#B45309" text-anchor="middle">𖬂𖬲𖬝𖬰 𖬖𖬤 𖬓𖬥𖬰 &amp; 𖭘 𖬖𖬲𖬜𖬵 𖭘 𖬖𖬲𖬜𖬵</text>
  <text x="100" y="418" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#D97706" text-anchor="middle">✓ 𖬐𖬶𖬟 𖬑𖬯 𖬂𖬲𖬤𖬵 𖬅𖬲𖬨𖬵 𖬍𖬥𖬰</text>

  <!-- ========================================================================= -->
