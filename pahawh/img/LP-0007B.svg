        <text x="385" y="294" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#475569" text-anchor="middle">𖬏𖬧 𖬋𖬰𖬯𖬵 𖬑𖬣</text>

