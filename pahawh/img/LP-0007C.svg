  <text x="53" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">LP-𖭐𖭐𖭐𖭗C</text>
  
  <!-- Name -->
  <!-- Dynamic Title to prevent collision -->
  <text x="96" y="26" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10" fill="#F8FAFC">𖬖𖬰𖬟𖬰 𖬗𖬮𖬰 𖬈𖬰𖬪𖬵 𖬖𖬲𖬜𖬵: 𖬉 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮 (𖬖𖬰𖬟𖬰 𖬗𖬮𖬰 𖬈𖬰𖬪𖬵 𖬖𖬲𖬜𖬵 𖬉 𖬖𖬲𖬤𖬵 𖬃𖬰𖬮)</text>
  
  <!-- Element Badge -->
  <rect x="495" y="9" width="165" height="24" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="577" y="25" font-family="'Noto Sans Pahawh Hmong', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8" text-anchor="middle">𖬓𖬥𖬰 𖬐𖬲𖬥/𖬒𖬶𖬝𖬰 (𖬐𖬲𖬥 𖬏𖬰𖬧𖬵 𖬒𖬶𖬝𖬰 Sha)</text>

  <!-- Score Badge -->
