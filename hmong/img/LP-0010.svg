        <text x="424" y="172" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="5.8" fill="#0F172A" text-anchor="middle">Rooj Loj</text>

        <!-- Compass Axis Badge -->
        <g transform="translate(478, 110)">
