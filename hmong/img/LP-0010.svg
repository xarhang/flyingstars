        <text x="360" y="126" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.2" fill="#0369A1" text-anchor="middle">Taub Hau</text>
        <text x="360" y="148" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6" fill="#475569" text-anchor="middle">Chaw Pw</text>

        <!-- Right Room: Main Living Hall -->
