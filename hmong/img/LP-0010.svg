        <circle cx="310" cy="150" r="8" fill="#16A34A"/>
        <circle cx="490" cy="170" r="9" fill="#CA8A04"/>
        <circle cx="525" cy="140" r="10" fill="#16A34A"/>
      
  </g>

  
  <!-- Bottom Doctrinal Summary -->
  <rect x="12" y="445" width="776" height="29" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
  <text x="400" y="457" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#F8FAFC" text-anchor="middle">Tswv Yim: Thaj av tus T muaj zog nias tsis sib npaug tus ncej</text>
  <text x="400" y="469" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#CBD5E1" text-anchor="middle">tsim cua tshuab tsoo yuav tsum faib av ua 2 feem nrog phab ntsa.</text>
</svg>
