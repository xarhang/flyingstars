
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- ========================================================================= -->
  <!-- TOP HUD BAR (Y=0 to 42) -->
  <!-- ========================================================================= -->
  <rect x="0" y="0" width="800" height="42" fill="#0F172A"/>
  
  <!-- ID Badge -->
  <rect x="18" y="9" width="70" height="24" rx="4" fill="#DC2626"/>
  <text x="53" y="25" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">LP-0007C</text>
  
  <!-- Name -->
  <!-- Dynamic Title to prevent collision -->
  <text x="96" y="26" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10" fill="#F8FAFC">San Jiao Tu: Kev Sab Xis (Thaj Av Peb Fab Kev Sab Xis)</text>
  
  <!-- Element Badge -->
  <rect x="495" y="9" width="165" height="24" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="577" y="25" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8" text-anchor="middle">Zog Hluav/Tsov (Fire/Tiger Sha)</text>

  <!-- Score Badge -->
  <rect x="670" y="9" width="112" height="24" rx="4" fill="#991B1B"/>
  <text x="726" y="25" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10.5" fill="#FEF2F2" text-anchor="middle">PHEM: 32 / 100</text>

  <!-- ========================================================================= -->
  <!-- LEFT COLUMN: CARDS (X=18 to 182) -->
  <!-- ========================================================================= -->

  <!-- Top-Left Card: Entrance & Driveway (Y=48 to 200) -->
  <rect x="12" y="48" width="174" height="152" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="48" width="174" height="24" rx="6" fill="#16A34A"/>
  <text x="100" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">QHOV ROOJ &amp; THAJ TSHAV</text>
  <text x="20" y="88" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#14532D">• Qhov Rooj Vag: Kev sab xis, deb kaum ntse &gt;18m</text>
  <text x="20" y="108" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#14532D">• Kev Tsheb: Nkhaus mos muag (S-Curve), txwv ncaj tua</text>
  <text x="20" y="128" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#14532D">• Tsis Muaj Dej: Tshav xyoob ntsuab kaj sau zog</text>
  <text x="20" y="148" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#14532D">• Yog Muaj Dej: Dej ntshiab puag ncig semicircular</text>
  
  <rect x="18" y="158" width="162" height="34" rx="4" fill="#DCFCE7"/>
  <text x="100" y="171" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#15803D" text-anchor="middle">Thaj Tshav Kaj: Huv si sau ntau lub zog</text>
  <text x="100" y="184" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#166534" text-anchor="middle">✓ Kev Nkhaus Muaj Siab Zoo (Qu Ze You Qing)</text>

  <!-- Bottom-Left Card: Gua & Compatibility (Y=206 to 442) -->
  <rect x="12" y="206" width="174" height="236" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="206" width="174" height="24" rx="6" fill="#D97706"/>
  <text x="100" y="222" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">ZOG BAGUA &amp; NEEG HAUM</text>
  <text x="20" y="246" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• Zog: Hluav Taws &amp; Tsov Dawb Sha</text>
  <text x="20" y="266" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• Tsov Dawb txav ceev: ceev faj kev sib cav</text>
  <text x="20" y="286" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• Zaj Ntsuab ciam luag: tsis muaj zog pab</text>
  <text x="20" y="306" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• ✗ Neeg Zog Ntoo (Gua 3, 4) ceev faj</text>
  <text x="20" y="326" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• Tsim phab ntsa thaiv cais thaj chaw</text>
  
  <rect x="18" y="346" width="162" height="86" rx="4" fill="#FEF3C7"/>
  <text x="100" y="364" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8" fill="#92400E" text-anchor="middle">Tsib Yam Zog &amp; Bagua</text>
  <text x="100" y="382" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#78350F" text-anchor="middle">Tsov Dawb phem: Tso pob zeb Tai Shan</text>
  <text x="100" y="402" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#B45309" text-anchor="middle">Tsib Yam Zog &amp; 8 Fab Bagua</text>
  <text x="100" y="418" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#D97706" text-anchor="middle">✓ Huab Cua Sib Npaug Zoo</text>

  <!-- ========================================================================= -->
  <!-- RIGHT COLUMN: CARDS (X=618 to 782) -->
  <!-- ========================================================================= -->

  <!-- Top-Right Card: House Positioning & Facing (Y=48 to 200) -->
  <rect x="614" y="48" width="174" height="152" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="48" width="174" height="24" rx="6" fill="#0284C7"/>
  <text x="700" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">CHAW TSO TSEV &amp; TSHAV</text>
  <text x="622" y="88" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#0369A1">• Chaw: Tso hauv thaj chaw tom qab dav</text>
  <text x="622" y="108" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#0369A1">• Deb kaum ntse &gt;18m</text>
  <text x="622" y="128" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#0369A1">• Ntsia (Xiang): Ntsia kev sab xis</text>
  <text x="622" y="148" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#0369A1">• Zaum (Zuo): Zaum phab tsev luag sab laug</text>
  
  <rect x="620" y="158" width="162" height="34" rx="4" fill="#E0F2FE"/>
  <text x="700" y="171" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#0369A1" text-anchor="middle">Taub Hau Pw: Phab ntsa sab tsev luag</text>
  <text x="700" y="184" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#0284C7" text-anchor="middle">Phab ntsa tuab tsis ncaj qhov rai</text>

  <!-- Bottom-Right Card: Remedies & Taboos (Y=206 to 442) -->
  <rect x="614" y="206" width="174" height="236" rx="6" fill="#FDF4FF" stroke="#A855F7" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="206" width="174" height="24" rx="6" fill="#9333EA"/>
  <text x="700" y="222" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">KEV KHO 4 KAUJ RUAM</text>
  <text x="622" y="246" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#6B21A8">1. Phab ntsa 2.2m txiav kaum ntse pem</text>
  <text x="622" y="266" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#6B21A8">2. Tso pob zeb Tai Shan ntawm kaum</text>
  <text x="622" y="286" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#6B21A8">3. Cog hav ntoo tuab 2.5m raws txoj kev</text>
  <text x="622" y="306" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#6B21A8">4. Pas dej semicircular tua hluav tsov</text>

  <rect x="620" y="326" width="162" height="106" rx="4" fill="#F3E8FF"/>
  <text x="700" y="342" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8" fill="#7E22CE" text-anchor="middle">Cov Lus Txwv (Taboos)</text>
  <text x="626" y="360" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#9333EA">• Txwv tsis tso tsev ze kaum ntse</text>
  <text x="626" y="377" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#9333EA">• Txwv tsis qhib qhov rooj kaum</text>
  <text x="626" y="394" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#9333EA">• Txwv tsis qhib qhov rooj dav sab tsov</text>
  <text x="700" y="418" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#7E22CE" text-anchor="middle">✓ Huv Si &amp; Teeb Pom Kev Zoo</text>

  <!-- ========================================================================= -->
  

  <!-- ========================================================================= -->
  <!-- CENTER: THE PLOT ARCHITECTURAL DRAWING (X=195 to 605, Y=48 to 384) -->
  <!-- ========================================================================= -->
  <g>
    
        <!-- Right Vertical Road (X=555..595, Y=65..430) -->
        <rect x="555" y="65" width="40" height="365" fill="url(#roadGrad)" rx="3"/>
        <line x1="575" y1="65" x2="575" y2="430" stroke="#FDE047" stroke-width="1.8" stroke-dasharray="10,6"/>
        <text x="583" y="240" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8.5" fill="#F8FAFC" text-anchor="middle" transform="rotate(90 583 240)">&#10140; Txoj Kev Sab Xis &#10140;</text>

        <!-- Surrounding Neighbor Property Labels -->
        <text x="400" y="74" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Ciam Av Tom Qab</text>
        <text x="225" y="220" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#64748B" text-anchor="middle" transform="rotate(-90 225 220)">Ciam Av Sab Laug</text>

        <!-- Right-Angled Wedge Plot (Bounded strictly X=240..550, Y=85..365) -->
        <!-- Right vertical along road: (550, 85) to (550, 365) -->
        <!-- Bottom horizontal: (240, 365) to (550, 365) -->
        <!-- Hypotenuse: (240, 365) to (550, 85) -->
        <polygon points="550,85 550,365 240,365" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>
        <polygon points="545,95 545,360 250,360" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,4"/>

        <!-- Top Apex Remedy Wall (Cutting off acute corner at 550, 85) -->
        <line x1="505" y1="125" x2="550" y2="125" stroke="#15803D" stroke-width="3.5"/>
        <circle cx="535" cy="105" r="7" fill="#16A34A"/>
        <circle cx="520" cy="112" r="8" fill="#15803D"/>
        <text x="525" y="98" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6" fill="#166534" text-anchor="middle">Phab Ntsa Txiav</text>

        <!-- Main House in Safe Wide Bottom-Left Zone (X=350..470, Y=255..305) -->
        <polygon points="350,255 415,235 480,255" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
        <rect x="360" y="255" width="110" height="50" fill="#FEF08A" stroke="#854D0E" stroke-width="2" rx="4"/>
        <text x="415" y="278" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#1E293B" text-anchor="middle">Lub Tsev</text>
        <text x="415" y="294" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#475569" text-anchor="middle">Chaw Txais Qhua</text>

        <!-- Front Main Door / Porch facing Right Road -->
        <rect x="470" y="275" width="5" height="15" fill="#1E293B"/>

        <!-- Compass Axis Badge on House Left -->
        <g transform="translate(310, 255)">
          <rect x="0" y="0" width="34" height="48" rx="3" fill="#FFFFFF" fill-opacity="0.92" stroke="#0284C7" stroke-width="1.2"/>
          <text x="17" y="12" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#0369A1" text-anchor="middle">Zaum ⬆</text>
          <line x1="17" y1="16" x2="17" y2="32" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="2,2"/>
          <polygon points="17,34 14,28 20,28" fill="#0284C7"/>
          <text x="17" y="43" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#0369A1" text-anchor="middle">Ntsia ⬇</text>
        </g>

        <!-- Ming Tang Bright Hall (Between House and Road, X=475..535, Y=250..315) -->
        <rect x="475" y="245" width="60" height="70" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" stroke-dasharray="3,2"/>
        <text x="505" y="275" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#15803D" text-anchor="middle">Tshav Kaj</text>
        <text x="505" y="288" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="5.8" fill="#166534" text-anchor="middle">Dav Kaj</text>

        <!-- Front Gate on Right Road (X=550, Y=330..355) -->
        <rect x="546" y="330" width="8" height="8" rx="1.5" fill="#1E293B" stroke="#0F172A" stroke-width="1.2"/>
        <rect x="546" y="352" width="8" height="8" rx="1.5" fill="#1E293B" stroke="#0F172A" stroke-width="1.2"/>
        <line x1="550" y1="334" x2="540" y2="340" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="550" y1="352" x2="540" y2="346" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>

        <!-- Driveway from Right Gate to House -->
        <path d="M 575 342 L 550 342 C 525 342 500 330 475 295" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="5,3"/>
        <text x="505" y="336" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.5" fill="#B45309" text-anchor="middle">⟿ Kev Nkhaus</text>

        <!-- [✓] Recommended Gate Badge -->
        <g transform="translate(455, 375)">
          <rect x="0" y="0" width="88" height="18" rx="3" fill="#15803D" stroke="#FFFFFF" stroke-width="1.2"/>
          <text x="44" y="12" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.2" fill="#FFFFFF" text-anchor="middle">✓ Rooj Vag Loj</text>
        </g>

        <!-- Apex Warning Badge -->
        <g transform="translate(395, 95)">
          <rect x="0" y="0" width="95" height="18" rx="3" fill="#DC2626"/>
          <text x="47" y="12" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.5" fill="#FFFFFF" text-anchor="middle">⚠️ Kaum Ntse Hluav Taws</text>
        </g>
      
  </g>

  
  <!-- Bottom Doctrinal Summary -->
  <rect x="12" y="445" width="776" height="29" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
  <text x="400" y="457" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#F8FAFC" text-anchor="middle">Tswv Yim: Thaj av peb fab muaj kev sab xis (White Tiger), sab laug yog tsev</text>
  <text x="400" y="469" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#CBD5E1" text-anchor="middle">luag. Tsov Dawb txav zog heev, yuav tsum txiav kaum ntse thiab cog ntoo thaiv.</text>
</svg>
