        <text x="542" y="168" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#FDE047" text-anchor="middle">Kev Sab Xis (Right Road)</text>

        <!-- Left Neighbor Boundary -->
