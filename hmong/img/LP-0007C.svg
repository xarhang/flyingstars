        <rect x="330" y="151" width="140" height="15" rx="3" fill="#15803D"/>
        <text x="400" y="162" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.2" fill="#FFFFFF" text-anchor="middle">[+] Phab Ntsa 2.2m Txiav</text>

        <!-- MING TANG BRIGHT HALL (ລານໝິງຖາງ / THAJ TSHAV KAJ) -->
        <!-- Bounded strictly inside triangular boundaries -->
        <polygon points="368,172 432,172 452,228 348,228" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="400" y="185" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#15803D" text-anchor="middle">Thaj Tshav Kaj (Ming Tang)</text>
        
        <!-- Semicircular Jade Belt Water Basin in Front of House (Central Axis) -->
        <path d="M 378 222 A 22 12 0 0 1 422 222 Z" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"/>
        <circle cx="400" cy="215" r="2.5" fill="#0284C7"/>
        <ellipse cx="400" cy="215" rx="10" ry="4" fill="none" stroke="#38BDF8" stroke-width="0.8"/>
        <text x="400" y="205" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.5" fill="#0369A1" text-anchor="middle">Pas Dej Puag Ncig (Yog Muaj)</text>

        <!-- SAFE RESIDENTIAL QUADRANT: Main House (x=330, y=236, w=140, h=65) -->
        <polygon points="325,236 400,214 475,236" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
        <rect x="330" y="236" width="140" height="65" fill="#FEF08A" stroke="#854D0E" stroke-width="2" rx="4"/>
        
        <!-- Architectural Room Partition inside House -->
        <line x1="378" y1="236" x2="378" y2="301" stroke="#CA8A04" stroke-width="1.5" stroke-dasharray="3,2"/>
        
        <!-- Master Bedroom on Quiet Left Flank (against neighbor boundary) -->
        <rect x="338" y="244" width="34" height="26" rx="2" fill="#FFFFFF" stroke="#0284C7" stroke-width="1"/>
        <rect x="338" y="244" width="34" height="7" fill="#0284C7"/>
        <text x="355" y="262" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.8" fill="#0369A1" text-anchor="middle">Taub Hau</text>
        <text x="355" y="288" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.2" fill="#475569" text-anchor="middle">Chaw Pw</text>

        <!-- Living Hall on Right (towards road & entrance) -->
        <text x="424" y="264" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10" fill="#1E293B" text-anchor="middle">Lub Tsev</text>
        <text x="424" y="282" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#475569" text-anchor="middle">Hauv Qab Dav</text>
        <rect x="416" y="298" width="16" height="5" fill="#1E293B"/>

        <!-- Compass Sitting & Facing Axis Badge (ທິດໜ້າ ⬆ / ທິດພິງ ⬇) -->
        <g transform="translate(480, 240)">
          <rect x="0" y="0" width="56" height="56" rx="4" fill="#FFFFFF" fill-opacity="0.96" stroke="#0284C7" stroke-width="1.2"/>
          <text x="28" y="14" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.5" fill="#0369A1" text-anchor="middle">Ntsia (向)</text>
          <line x1="28" y1="18" x2="28" y2="34" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="2,2"/>
          <polygon points="28,16 25,22 31,22" fill="#0284C7"/>
          <polygon points="28,38 25,32 31,32" fill="#0284C7"/>
          <text x="28" y="49" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.5" fill="#0369A1" text-anchor="middle">Zaum (坐)</text>
        </g>

        <!-- DRIVEWAY PASSING THROUGH GATE TO COURTYARD -->
        <path d="M 565 348 L 516 348 C 490 348 465 320 445 295" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-dasharray="5,4"/>
        <text x="340" y="280" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.8" fill="#B45309" text-anchor="middle" transform="rotate(-25 340 280)">⟿ Kev Nkhaus Zoo Siab</text>

        <!-- [✓] RECOMMENDED GATE BADGE (OFFSET TO RIGHT CLEAR OF DRIVEWAY) -->
        <g transform="translate(528, 339)">
          <rect x="0" y="0" width="82" height="18" rx="3" fill="#15803D" stroke="#FFFFFF" stroke-width="1.2"/>
          <text x="41" y="12" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#FFFFFF" text-anchor="middle">✓ Rooj Vag Loj</text>
          <line x1="0" y1="9" x2="-6" y2="9" stroke="#15803D" stroke-width="2"/>
          <circle cx="-6" cy="9" r="2" fill="#15803D"/>
        </g>

        <!-- [✗] FORBIDDEN GATE BADGE (ANCHORED TO ACUTE FENCE APEX) -->
        <g transform="translate(355, 76)">
          <rect x="0" y="0" width="90" height="18" rx="3" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.2"/>
          <text x="45" y="12" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.8" fill="#FFFFFF" text-anchor="middle">✗ Txwv Rooj Vag</text>
          <line x1="45" y1="18" x2="45" y2="24" stroke="#DC2626" stroke-width="2"/>
          <circle cx="45" cy="24" r="2" fill="#DC2626"/>
        </g>

        <!-- Rear Base Xuan Wu Buffer -->
        <line x1="255" y1="408" x2="545" y2="408" stroke="#15803D" stroke-width="5"/>
        <circle cx="295" cy="396" r="8" fill="#14532D"/>
        <circle cx="350" cy="394" r="9" fill="#166534"/>
        <circle cx="400" cy="392" r="10" fill="#14532D"/>
        <circle cx="450" cy="394" r="9" fill="#166534"/>
        <circle cx="505" cy="396" r="8" fill="#14532D"/>
      
  </g>

  
  <!-- Bottom Doctrinal Summary -->
  <rect x="12" y="445" width="776" height="29" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
  <text x="400" y="457" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#F8FAFC" text-anchor="middle">Tswv Yim: Thaj av peb fab muaj kev sab xis (White Tiger), sab laug yog tsev</text>
  <text x="400" y="469" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#CBD5E1" text-anchor="middle">luag. Tsov Dawb txav zog heev, yuav tsum txiav kaum ntse thiab cog ntoo thaiv.</text>
</svg>
