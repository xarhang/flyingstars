  <text x="400" y="469" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#CBD5E1" text-anchor="middle">ntxhov siab yuav tsum ua phab ntsa faib ua 4 fab ncaj hauv plawv.</text>
