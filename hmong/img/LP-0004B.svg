  </g>

  
  <!-- Bottom Doctrinal Summary -->
  <rect x="12" y="445" width="776" height="29" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
  <text x="400" y="457" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#F8FAFC" text-anchor="middle">Tswv Yim: Thaj av hu lu ntxeev (ncauj me pem hauv ntej, nram qab loj puag ncig) yog thaj</text>
  <text x="400" y="469" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#CBD5E1" text-anchor="middle">av muaj hmoov loj tshaj plaws ceev nyiaj txiag thiab koob hmoov, tsis pub zog xau tawm.</text>
