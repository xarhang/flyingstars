
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- TOP TITLE HUD BAR -->
  <rect x="0" y="0" width="800" height="42" fill="#0F172A"/>
  <rect x="18" y="9" width="80" height="24" rx="4" fill="#475569"/>
  <text x="58" y="25" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">ENV-0004</text>
  <text x="108" y="26" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#F8FAFC">Pob Tsom Zeb, Pob Ntxhab &amp; Roob Ntse: Roob Sha &amp; Kev Kho (Cliff &amp; Rock Sha)</text>
  <rect x="580" y="9" width="105" height="24" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="632" y="25" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8" text-anchor="middle">Roob Sha</text>
  <rect x="692" y="9" width="90" height="24" rx="4" fill="#B45309"/>
  <text x="737" y="25" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10.5" fill="#FEF2F2" text-anchor="middle">Kho Av-Ntoo</text>

  <!-- LEFT COLUMN CARDS -->
  <rect x="12" y="48" width="174" height="185" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="48" width="174" height="24" rx="6" fill="#475569"/>
  <text x="100" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">⛰️ Cov Roob Sha</text>
  <text x="20" y="86" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#1E293B">• Roob ntsej muag tawg (Po Mian):</text>
  <text x="26" y="99" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.8" fill="#475569">→ Av liam, raug mob</text>
  <text x="20" y="115" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#1E293B">• Roob soj ntsuam (Tan Tou):</text>
  <text x="26" y="128" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.8" fill="#475569">→ Tub sab, neeg dag ntxias</text>
  <rect x="18" y="140" width="162" height="34" rx="3" fill="#F1F5F9"/>
  <text x="99" y="154" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.8" fill="#0F172A" text-anchor="middle">Kev phom sij tiag:</text>
  <text x="99" y="166" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.2" fill="#475569" text-anchor="middle">Zeb poob, av liam, cua hnyiab</text>

  <rect x="12" y="240" width="174" height="202" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="240" width="174" height="24" rx="6" fill="#15803D"/>
  <text x="100" y="256" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">🛡️ 3 Kauj Ruam Kho</text>
  <text x="20" y="278" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#14532D">1. Tsim phab ntsa thaiv av</text>
  <text x="26" y="291" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.8" fill="#166534">Nrog qhov tso dej</text>
  <text x="20" y="307" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#14532D">2. Cog ntoo thuv thaiv</text>
  <text x="20" y="324" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#14532D">3. Ua kauj ruam ntaiv</text>
  <rect x="18" y="336" width="162" height="46" rx="3" fill="#DCFCE7"/>
  <text x="99" y="350" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#14532D" text-anchor="middle">Qhov deb nyab xeeb:</text>
  <text x="99" y="364" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.5" fill="#166534" text-anchor="middle">Deb ntawm taw roob >10-15m</text>

  <!-- CENTER SITE PLAN -->
  <g id="centerSite">
    <!-- STEEP JAGGED CLIFF IN REAR (Y=48 to 145) -->
    <path d="M 195 48 L 195 130 L 230 115 L 260 140 L 300 120 L 340 145 L 390 125 L 430 145 L 480 120 L 520 140 L 560 115 L 605 135 L 605 48 Z" fill="url(#rockGrad)"/>
    <!-- Craggy Rock Outcrops -->
    <polygon points="260,110 275,80 290,115" fill="#94A3B8"/>
    <polygon points="350,115 370,75 390,120" fill="#CBD5E1"/>
    <polygon points="450,110 470,78 490,115" fill="#94A3B8"/>
    <text x="400" y="70" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8.5" fill="#FEF2F2" text-anchor="middle">⛰️ Pob Ntxhab &amp; Roob Ntse</text>
    <text x="400" y="85" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#FCA5A5" text-anchor="middle">Kev phom sij zeb poob</text>

    <!-- HEAVY DUTY RETAINING WALL AT CLIFF BASE (Y=143 to 155) -->
    <rect x="200" y="143" width="400" height="12" fill="#475569" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Weep drainage holes -->
    <circle cx="230" cy="149" r="2" fill="#0284C7"/>
    <circle cx="270" cy="149" r="2" fill="#0284C7"/>
    <circle cx="310" cy="149" r="2" fill="#0284C7"/>
    <circle cx="350" cy="149" r="2" fill="#0284C7"/>
    <circle cx="390" cy="149" r="2" fill="#0284C7"/>
    <circle cx="430" cy="149" r="2" fill="#0284C7"/>
    <circle cx="470" cy="149" r="2" fill="#0284C7"/>
    <circle cx="510" cy="149" r="2" fill="#0284C7"/>
    <circle cx="550" cy="149" r="2" fill="#0284C7"/>
    <text x="400" y="167" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.8" fill="#15803D" text-anchor="middle">✓ Phab ntsa thaiv av + Qhov tso dej</text>

    <!-- PINE TREE BUFFER BEHIND HOUSE (Y=172 to 195) -->
    <circle cx="230" cy="185" r="9" fill="#14532D"/>
    <circle cx="270" cy="185" r="9" fill="#166534"/>
    <circle cx="310" cy="185" r="9" fill="#14532D"/>
    <circle cx="350" cy="185" r="9" fill="#166534"/>
    <circle cx="390" cy="185" r="9" fill="#14532D"/>
    <circle cx="430" cy="185" r="9" fill="#166534"/>
    <circle cx="470" cy="185" r="9" fill="#14532D"/>
    <circle cx="510" cy="185" r="9" fill="#166534"/>
    <circle cx="550" cy="185" r="9" fill="#14532D"/>
    <circle cx="580" cy="185" r="9" fill="#166534"/>

    <!-- RESIDENTIAL PLOT GROUND (Y=195 to 400) -->
    <rect x="200" y="195" width="400" height="205" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>

    <!-- SAFE HOUSE (SET BACK >15m FROM CLIFF) -->
    <polygon points="340,225 400,205 460,225" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
    <rect x="345" y="225" width="110" height="55" fill="#FEF08A" stroke="#854D0E" stroke-width="1.8" rx="3"/>
    <text x="400" y="250" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9.5" fill="#1E293B" text-anchor="middle">Lub Tsev</text>
    <text x="400" y="263" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#475569" text-anchor="middle">Zaum ntoo thuv &amp; phab ntsa</text>
    <rect x="392" y="277" width="16" height="5" fill="#1E293B"/>

    <!-- Ming Tang Lawn In Front -->
    <rect x="300" y="300" width="200" height="55" rx="5" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="400" y="318" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8" fill="#15803D" text-anchor="middle">Thaj Tshav Kaj Pem Hauv Ntej</text>
    <text x="400" y="332" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.5" fill="#166534" text-anchor="middle">✓ Tshav ntsuab kaj txais teeb</text>
    <text x="400" y="344" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.0" fill="#0284C7" text-anchor="middle">• Pas dej sab zaj 10-15%</text>

    <!-- Front Road -->
    <rect x="200" y="400" width="400" height="25" fill="#334155"/>
    <line x1="200" y1="412" x2="600" y2="412" stroke="#FBBF24" stroke-width="2" stroke-dasharray="8,6"/>
    <text x="400" y="420" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#FFFFFF" text-anchor="middle">Kev Loj</text>
    <rect x="385" y="396" width="30" height="8" rx="1.5" fill="#15803D"/>
  </g>

  <!-- RIGHT COLUMN CARDS -->
  <rect x="614" y="48" width="174" height="185" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="48" width="174" height="24" rx="6" fill="#334155"/>
  <text x="701" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8.8" fill="#FFFFFF" text-anchor="middle">🛡️ Kev Tiv Thaiv Tiag</text>
  <text x="622" y="86" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#0F172A">1. Qhov tso dej hauv phab ntsa</text>
  <text x="628" y="99" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.8" fill="#475569">Txo zog dej hauv av</text>
  <text x="622" y="115" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#0F172A">2. Cog nroj tiv thaiv av</text>
  <text x="622" y="132" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#0F172A">3. Hlua hlau thaiv zeb poob</text>
  <rect x="620" y="145" width="162" height="32" rx="3" fill="#E2E8F0"/>
  <text x="701" y="159" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.8" fill="#1E293B" text-anchor="middle">Hloov roob phem ua Xuan Wu</text>
  <text x="701" y="170" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.2" fill="#475569" text-anchor="middle">Nrog ntoo thuv &amp; phab ntsa</text>

  <rect x="614" y="240" width="174" height="202" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="240" width="174" height="24" rx="6" fill="#DC2626"/>
  <text x="701" y="256" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8.8" fill="#FFFFFF" text-anchor="middle">🚫 Cov Lus Txwv</text>
  <text x="622" y="278" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#991B1B">• Txwv tsim tsev ze taw roob</text>
  <text x="622" y="295" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#991B1B">• Txwv tsev ntsia ncaj pob tsom</text>
  <text x="622" y="312" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#991B1B">• Txwv khawb taw roob yam tsis zoo</text>
  <rect x="620" y="325" width="162" height="48" rx="3" fill="#FEE2E2"/>
  <text x="701" y="340" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#B91C1C" text-anchor="middle">Kev Nyab Xeeb Loj Tshaj:</text>
  <text x="701" y="353" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.5" fill="#991B1B" text-anchor="middle">Thim tsev kom dhau thaj chaw</text>
  <text x="701" y="365" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.2" fill="#7F1D1D" text-anchor="middle">Tshawb xyuas pob zeb tas li</text>

  <!-- BOTTOM SUMMARY BAR -->
  <rect x="0" y="445" width="800" height="35" fill="#0F172A"/>
  <text x="400" y="460" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#F8FAFC" text-anchor="middle">Tswv Yim: Pob ntxhab &amp; roob ntse yog Roob Sha uas pheej hmoo av liam. Yuav tsum tsim phab ntsa thaiv av.</text>
  <text x="400" y="472" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.8" fill="#94A3B8" text-anchor="middle">Thim tsev deb >15m, cog ntoo thuv tuab, thiab ua qhov tso dej kom tsis txhob liam.</text>
</svg>
