    <text x="450" y="316" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.5" fill="#166534" text-anchor="middle">✓ Tshav xyoob ntsuab kaj txais zog Yang</text>
    <text x="450" y="330" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6" fill="#0284C7" text-anchor="middle">• Pas dej 10-15% sab zaj</text>

