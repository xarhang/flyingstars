    <text x="400" y="248" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#475569" text-anchor="middle">Nyab xeeb los ntawm phab ntsa</text>
    <rect x="392" y="262" width="16" height="5" fill="#1E293B"/>

