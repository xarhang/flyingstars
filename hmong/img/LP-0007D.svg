        <circle cx="375" cy="285" r="7" fill="#16A34A"/>
        <circle cx="400" cy="282" r="9" fill="#15803D"/>
        <circle cx="425" cy="285" r="7" fill="#16A34A"/>
        <text x="400" y="306" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.5" fill="#166534" text-anchor="middle">Phab Ntsa 2.2m &amp; Ntoo Thaiv</text>

