    <rect x="393" y="292" width="14" height="18" fill="#1E293B"/>
    <rect x="366" y="276" width="68" height="38" rx="4" fill="none" stroke="#991B1B" stroke-width="1.2" stroke-dasharray="4,2"/>
  
      
    <rect x="380" y="110" width="354" height="24" rx="6" fill="#FEF2F2" fill-opacity="0.96" stroke="#DC2626" stroke-width="1.3"/>
    <text x="557" y="126" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="11" fill="#B91C1C" text-anchor="middle">ລົມພັດແຮງຮອບທິດ (3.5 - 6.5 m/s) ໄຮ້ພູເຂົາບັງ</text>
  
      
    <rect x="240" y="340" width="309" height="24" rx="6" fill="#FEF2F2" fill-opacity="0.96" stroke="#DC2626" stroke-width="1.3"/>
    <text x="394.5" y="356" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="11" fill="#B91C1C" text-anchor="middle">ເຮືອນໂດດດ່ຽວກາງທົ່ງ ພະລັງຊີ່ກະແຈກກະຈາຍ</text>
  
    
  
    <rect x="20" y="10" width="760" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.97" stroke="#DC2626" stroke-width="1.8"/>
    <text x="35" y="33" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="14" fill="#DC2626">LT-0481</text>
    <text x="115" y="33" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="12" fill="#1E293B">ລົມພັດແຮງກາງທົ່ງຮາບ (Feng Chui Sha - 风吹煞)</text>
    
    <rect x="625" y="14" width="145" height="28" rx="6" fill="#991B1B"/>
