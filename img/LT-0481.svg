    <rect x="20" y="420" width="760" height="50" rx="6" fill="#FFFFFF" fill-opacity="0.96" stroke="#DC2626" stroke-width="1.2"/>
    <text x="32" y="438" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#0F172A">ລັກສະນະພະລັງງານ: </tspan>ເຮືອນໂດດດ່ຽວກາງທົ່ງຮາບ ບໍ່ມີພູເຂົາ ຫຼື ຕົ້ນໄມ້ບັງລົມ, ກະແສລົມພັດແຮງເກີນ 3.5-6.5 m/s ພັດກະຈາຍພະລັງຊີ່.</text>
    <text x="32" y="458" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#0F172A">ວິທີແກ້ໄຂ / ຂໍ້ແນະນຳ: </tspan>ປູກແນວຕົ້ນໄມ້ກັນລົມ 3 ຊັ້ນຮອບບໍລິເວນ, ສ້າງກຳແພງສູງ 2 ແມັດປ້ອງກັນລົມ.</text>
  
</svg>
  