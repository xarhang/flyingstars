  <rect x="18" y="448" width="764" height="26" rx="5" fill="#1E293B"/>
  <text x="400" y="465" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">ທາງເຂົ້າແຄບຍາວຄືລຳປືນ ເຮັດໃຫ້ລົມພຸ່ງເຂົ້າມາດ້ວຍຄວາມໄວສູງ (Venturi Effect) ປະທະຕົວເຮືອນ.</text>
</svg>
