  <text x="400" y="465" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">ຖືກກະແສລົມແລະລົດພັດຕັດຜ່ານທຸກທິດທາງ (Four-Side Rushing Wind), ບໍ່ມີທິດເຕົ່າດຳ (Xuan Wu) ພິງຫຼັງ, ພະລັງງານແຕກກະຈາຍ.</text>
