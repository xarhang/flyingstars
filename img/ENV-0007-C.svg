  </g>

  <!-- BOTTOM DOCTRINAL SUMMARY CARD (Y=448 to 474) -->
  <!-- ========================================================================= -->
  <rect x="18" y="448" width="764" height="26" rx="5" fill="#1E293B"/>
  <text x="400" y="465" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">ຫຼັກການຮວງຈຸ້ຍ: ສຸດຍອດດິນແຄມນ້ຳທີ່ມີຖະໜົນສາຍຫຼັກແລ່ນຂະໜານ ພ້ອມຂົວຫີນແໜ້ນໜາຂ້າມນ້ຳເຂົ້າສູ່ອາຄານ. ໂຊກລາບຄົບທັງນ້ຳແທ້ ແລະ ນ້ຳທຽມ.</text>
