        <line x1="270" y1="95" x2="530" y2="95" stroke="#14532D" stroke-width="4"/>
        <line x1="270" y1="95" x2="270" y2="355" stroke="#334155" stroke-width="3"/>
        <line x1="530" y1="95" x2="530" y2="355" stroke="#334155" stroke-width="3"/>
        <text x="245" y="220" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#64748B" text-anchor="middle" transform="rotate(-90 245 220)">ເພື່ອນບ້ານຊ້າຍ</text>
        <text x="555" y="220" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#64748B" text-anchor="middle" transform="rotate(90 555 220)">ເພື່ອນບ້ານຂວາ</text>

        
    <!-- House Structure & Interior -->
    <rect x="335" y="140" width="130" height="65" fill="#FEF08A" stroke="#854D0E" stroke-width="2" rx="4"/>
    <polygon points="325,140 400,115 475,140" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
    <line x1="392" y1="140" x2="392" y2="205" stroke="#B45309" stroke-width="1.2" stroke-dasharray="3,2"/>
    
      <!-- Master Bedroom -->
      <rect x="341" y="146" width="28" height="20" fill="#FFFFFF" stroke="#0284C7" stroke-width="1" rx="2"/>
      <rect x="341" y="146" width="28" height="5" fill="#0284C7" rx="1"/>
      <text x="355" y="156" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6" fill="#0369A1" text-anchor="middle">ຫົວຕຽງ</text>
      <text x="355" y="193" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.2" fill="#475569" text-anchor="middle">ຫ້ອງນອນໃຫຍ່</text>
    
    
      <!-- Living Hall -->
      <text x="428.5" y="160" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#1E293B" text-anchor="middle">ອາຄານຫຼັກ</text>
      <text x="428.5" y="175" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#475569" text-anchor="middle">ຫ້ອງໂຖງໃຫຍ່</text>
    
    
        <!-- Front Main Door Step & Prominent Label -->
        <rect x="418.5" y="205" width="20" height="5" fill="#1E293B"/>
        <text x="428.5" y="219" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.5" fill="#0F172A" text-anchor="middle">ປະຕູໃຫຍ່</text>
      
  

        <!-- PHYSICAL FRONT FENCE WITH GATE OPENING -->
        <line x1="270" y1="355" x2="305" y2="355" stroke="#334155" stroke-width="3.5"/>
        <line x1="355" y1="355" x2="530" y2="355" stroke="#334155" stroke-width="3.5"/>

        <!-- GATE POSTS ON FRONT FENCE LINE -->
