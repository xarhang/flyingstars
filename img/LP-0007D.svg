        <line x1="385" y1="355" x2="395" y2="344" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="415" y1="355" x2="405" y2="344" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>

