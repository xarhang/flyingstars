        <text x="350" y="270" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.5" fill="#B45309" text-anchor="middle">⟿ ທາງລົດໂຄ້ງ S-Curve</text>

        <!-- Recommended Gate Badge -->
