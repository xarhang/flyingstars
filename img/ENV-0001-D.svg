    <text x="485" y="260" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#15803D" text-anchor="middle">ລານໝິງຖາງໂລ່ງແຈ້ງ</text>
    <text x="485" y="275" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.5" fill="#166534" text-anchor="middle">✓ ຮັບໂຊກລາບ &amp; ພະລັງງານຊີວິດ</text>
    <text x="485" y="290" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.2" fill="#0284C7" text-anchor="middle">• ທາງລົດແລ່ນເຂົ້າສະດວກສະບາຍ</text>

    <!-- Front Road -->
    <rect x="200" y="400" width="400" height="25" fill="#334155"/>
    <line x1="200" y1="412" x2="600" y2="412" stroke="#FBBF24" stroke-width="2" stroke-dasharray="8,6"/>
    <text x="400" y="420" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#FFFFFF" text-anchor="middle">ຖະໜົນໃຫຍ່ດ້ານໜ້າ (Facing Main Road) ຮັບແສງສະຫວ່າງ</text>

