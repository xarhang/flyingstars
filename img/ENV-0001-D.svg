    <text x="285" y="315" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.5" fill="#15803D" text-anchor="middle">ປູກຫຍ້າຂຽວ + ດອກໄມ້ສີສົດໃສ</text>
    <text x="285" y="330" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.2" fill="#0284C7" text-anchor="middle">ແສງແດດເຕັມທີ່ ລ້າງໄອຢິນ 100%</text>
    <text x="285" y="355" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.5" fill="#166534" text-anchor="middle">✓ ປ່ຽນພື້ນທີ່ຮ້າຍກາຍເປັນພື້ນທີ່ໂຊກ</text>

    <!-- RIGHT ZONE: SAFE BUILDING ZONE (SAFE HOUSE) -->
    <rect x="375" y="60" width="215" height="312" rx="6" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.8" stroke-dasharray="4,3"/>
