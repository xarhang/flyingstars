  <!-- RIGHT COLUMN CARDS -->
  <rect x="614" y="48" width="174" height="185" rx="6" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="48" width="174" height="24" rx="6" fill="#7E22CE"/>
  <text x="701" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8.8" fill="#FFFFFF" text-anchor="middle">🛠️ 4 ຂັ້ນຕອນແກ້ສຸສານໃນດິນ</text>
  <text x="622" y="86" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#581C87">1. ຍ້າຍອັດຖິອອກຕາມພິທີກຳ</text>
  <text x="622" y="103" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#581C87">2. ລອກດິນ 1.5-2m ຕາກແດດ 49 ວັນ</text>
  <text x="622" y="120" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#581C87">3. ຖົມດິນ 5 ສີ/ດິນດານໃໝ່ສະອາດ</text>
  <text x="622" y="137" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#581C87">4. ປັບເປັນສວນດອກໄມ້/ບ່ອນຈອດລົດ</text>
  <rect x="620" y="148" width="162" height="30" rx="3" fill="#F3E8FF"/>
  <text x="701" y="161" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.8" fill="#6B21A8" text-anchor="middle">ກົດຫຼັກ: ຕາກແດດ 49 ວັນດູດຢາງ</text>
  <text x="701" y="172" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.2" fill="#581C87" text-anchor="middle">ປ່ຽນພື້ນທີ່ຢິນໃຫ້ກາຍເປັນໂລ່ງແຈ້ງ</text>

  <rect x="614" y="240" width="174" height="202" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="240" width="174" height="24" rx="6" fill="#15803D"/>
  <text x="701" y="256" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8.8" fill="#FFFFFF" text-anchor="middle">📐 ການຈັດວາງຜັງອາຄານ</text>
  <text x="622" y="278" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#14532D">• ແຍກເຂດສຸສານເກົ່າເປັນສວນດອກໄມ້</text>
  <text x="622" y="295" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#14532D">• ປຸກເຮືອນໃນ 'ເຂດດິນບໍລິສຸດ'</text>
  <text x="622" y="312" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#14532D">• ປູກຫຍ້າຂຽວ + ດອກໄມ້ສີສົດໃສ</text>
  <rect x="620" y="325" width="162" height="48" rx="3" fill="#DCFCE7"/>
  <text x="701" y="339" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#166534" text-anchor="middle">ຂໍ້ຫ້າມສຳຄັນທີ່ສຸດ:</text>
  <text x="701" y="352" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.5" fill="#14532D" text-anchor="middle">ຫ້າມສ້າງຫ້ອງນອນ/ຫ້ອງຮັບແຂກທັບ</text>
  <text x="701" y="364" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.2" fill="#166534" text-anchor="middle">ໃຫ້ຈັດເປັນສວນດອກໄມ້ ຫຼື ບ່ອນຈອດລົດ</text>

  <!-- BOTTOM SUMMARY BAR -->
  <rect x="0" y="445" width="800" height="35" fill="#0F172A"/>
  <text x="400" y="460" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#F8FAFC" text-anchor="middle">ຫຼັກຮວງຈຸ້ຍສຸສານໃນດິນ: ເປັນຢິນຊ່າຮຸນແຮງ ຫ້າມປຸກເຮືອນທັບເດັດຂາດ! ຕ້ອງຍ້າຍອັດຖິຕາມພິທີ ແລະ ຂຸດລອກດິນ 1.5m ຕາກແດດ 49 ວັນ.</text>
  <text x="400" y="472" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.8" fill="#94A3B8" text-anchor="middle">ການວາງຜັງ: ຖົມດິນໃໝ່ສະອາດ ແລ້ວຈັດຈຸດດັ່ງກ່າວເປັນສວນດອກໄມ້ກາງແຈ້ງ ຫຼື ບ່ອນຈອດລົດ ໃຫ້ປຸກຕົວເຮືອນໃນເຂດດິນບໍລິສຸດເທົ່ານັ້ນ.</text>
</svg>
