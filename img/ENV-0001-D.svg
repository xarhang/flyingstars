    <text x="285" y="258" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.5" fill="#166534" text-anchor="middle">✓ ປັບເປັນພື້ນທີ່ໂລ່ງແຈ້ງຮັບແສງແດດ</text>
    
    <!-- Flower & Sun Decor in Garden -->
