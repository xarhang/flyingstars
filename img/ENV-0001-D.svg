    <text x="285" y="178" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.2" fill="#15803D" text-anchor="middle">1. ຍ້າຍອັດຖິ ➔ 2. ລອກດິນ 1.5m</text>
    <text x="285" y="190" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.2" fill="#15803D" text-anchor="middle">3. ຕາກແດດ 49 ວັນ ➔ 4. ຖົມດິນໃໝ່</text>
