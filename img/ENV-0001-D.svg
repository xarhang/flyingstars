      <text x="75" y="76" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.5" fill="#B91C1C" text-anchor="middle">❌ ຫ້າມປຸກເຮືອນທັບເດັດຂາດ!</text>
