    <text x="485" y="178" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#15803D" text-anchor="middle">✓ ຕັ້ງຢູ່ເຂດດິນບໍລິສຸດ ປອດໄພ 100%</text>
    <text x="485" y="193" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.8" fill="#475569" text-anchor="middle">ບໍ່ມີໄອຢິນລົບກວນ ສຸຂະພາບແຂງແຮງ</text>
    <rect x="477" y="220" width="16" height="5" fill="#1E293B"/>

