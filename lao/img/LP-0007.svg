  <polygon points="400,95 375,145 425,145" fill="#FEE2E2"/>
  <text x="400" y="116" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="8" fill="#991B1B" text-anchor="middle">ມຸມແຫຼມ &lt; 36°</text>
  <text x="400" y="128" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.2" fill="#DC2626" text-anchor="middle">ເຂດມຸມແຫຼມອັນຕະລາຍ</text>
  <text x="400" y="139" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.8" fill="#B91C1C" text-anchor="middle">ຫ້າມສ້າງເຮືອນ</text>

