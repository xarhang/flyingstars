  <polygon points="368,172 432,172 452,228 348,228" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="400" y="185" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#15803D" text-anchor="middle">ລານໝິງຖາງໂລ່ງແຈ້ງ (Bright Hall)</text>
  <text x="400" y="198" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.5" fill="#166534" text-anchor="middle">✓ ລານຫຍ້າຂຽວໂລ່ງຮັບແສງ-ລົມ (ດີເລີດທີ່ສຸດ)</text>
  <text x="400" y="210" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="5.8" fill="#0284C7" text-anchor="middle">• ອ່າງນ້ຳພຸ (ຖ້າມີ): ຂະໜາດນ້ອຍ 10-15%</text>

