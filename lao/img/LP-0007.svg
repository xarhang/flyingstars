
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Top HUD Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#0F172A"/>
  <rect x="18" y="9" width="70" height="24" rx="4" fill="#DC2626"/>
  <text x="53" y="25" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">LP-0007</text>
  <text x="100" y="26" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="12.5" fill="#F8FAFC">ຕອນດິນສາມຫຼ່ຽມ ຄົມມີດຕັດ ທາງສາມແພ່ງ (Scissors Sha / ມີດຕັດສາມແພ່ງ)</text>
  <rect x="670" y="9" width="112" height="24" rx="4" fill="#991B1B"/>
  <text x="726" y="25" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10.5" fill="#FEF2F2" text-anchor="middle">ອັນຕະລາຍ: 18 / 100</text>

  <!-- ========================================================================= -->
  <!-- LEFT COLUMN: CARDS (X=18 to 182) -->
  <!-- ========================================================================= -->
  <rect x="12" y="48" width="174" height="150" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="48" width="174" height="24" rx="6" fill="#16A34A"/>
  <text x="100" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">ທາງເຂົ້າ &amp; ລານໝິງຖາງ</text>
  <text x="20" y="88" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#14532D">• ປະຕູຮົ້ວ: ຕັ້ງຝັ່ງມັງກອນ ຫ່າງມຸມແຫຼມ &gt;15m</text>
  <text x="26" y="106" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#14532D">• ທາງລົດ: ໂຄ້ງອ່ອນນ້ອມ ຫ້າມແທງຊື່ຫາເຮືອນ</text>
  <text x="26" y="124" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#14532D">• ບໍ່ມີບໍ່ນ້ຳ: ລານຫຍ້າຂຽວໂລ່ງ ຮັບແສງ-ລົມ</text>
  <rect x="18" y="138" width="162" height="52" rx="4" fill="#DCFCE7"/>
  <text x="100" y="156" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#15803D" text-anchor="middle">• ຫາກມີບໍ່ນ້ຳ: ນ້ຳໃສສະອາດ ໂອບອຸ້ມເຄິ່ງວົງ</text>
  <text x="100" y="174" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#166534" text-anchor="middle">✓ ທາງໂຄ້ງມີໄມຕີ (ເສັ້ນໂຄ້ງມີເມດຕາ) ປອດໄພສູງ</text>

  <rect x="12" y="204" width="174" height="240" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="18" y="204" width="164" height="24" rx="6" fill="#D97706"/>
  <text x="100" y="220" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">ທາດກວ້າ &amp; ຄວາມຖືກຊາຕາ</text>
  <text x="26" y="242" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#78350F">• ທາດປະຈຳຮູບ: ທາດໄຟ (ທາດໄຟ)</text>
  <text x="26" y="259" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#78350F">• ລັກສະນະ: ຄົມມີດ, ໄຟພິສ</text>
  <text x="26" y="276" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#78350F">• ✗ ບໍ່ຖືກກັບ: ທາດທອງ &amp; ໄມ້</text>
  <text x="26" y="293" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#78350F">• ຫ້າມຄົນກວ້າ: 6, 7, 3, 4</text>
  <text x="26" y="310" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#78350F">• ✓ ຖືກກັບ: ຄົນທາດດິນ (2, 8)</text>
  
  <rect x="18" y="324" width="162" height="110" rx="4" fill="#FEF3C7"/>
  <text x="100" y="342" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.8" fill="#92400E" text-anchor="middle">ກົດເກນທາດໄຟຮ້ອນ (Huo Sha)</text>
  <text x="100" y="360" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#78350F" text-anchor="middle">ໄຟຫຼອມທອງ: ຜ່າຕັດ, ອຸບັດຕິເຫດ</text>
  <text x="100" y="378" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#78350F" text-anchor="middle">ຕ້ອງຕັດມຸມປ່ຽນເປັນ 4 ຫຼ່ຽມ</text>
  <text x="100" y="398" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.2" fill="#B45309" text-anchor="middle">✓ ປັບພະລັງໃຫ້ສົມດຸນ</text>

  <!-- ========================================================================= -->
  <!-- RIGHT COLUMN: CARDS (X=618 to 782) -->
  <!-- ========================================================================= -->
  <rect x="614" y="48" width="174" height="150" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="48" width="174" height="24" rx="6" fill="#DC2626"/>
  <text x="700" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">ຜົນກະທົບຄົມມີດ &amp; ໄຟພິສ</text>
  <text x="622" y="88" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#991B1B">• ພະລັງທາດໄຟຮ້ອນ (Huo Sha)</text>
  <text x="626" y="106" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#991B1B">• ລົດພຸ່ງຊົນມຸມແຫຼມເລື້ອຍໆ</text>
  <text x="626" y="124" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#991B1B">• ເກີດຄະດີຄວາມ, ຜ່າຕັດ</text>
  <text x="626" y="142" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#991B1B">• ເງິນຄຳຮົ່ວໄຫຼຍ້ອນແຮງລົມ</text>
  <rect x="620" y="152" width="162" height="38" rx="4" fill="#FEE2E2"/>
  <text x="700" y="167" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#B91C1C" text-anchor="middle">ທິດຫົວຕຽງ: ພິງຝາທຶບ</text>
  <text x="700" y="181" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#DC2626" text-anchor="middle">ຫ້າມຫັນຫົວໄປຫາມຸມແຫຼມ</text>

  <rect x="614" y="204" width="174" height="240" rx="6" fill="#FDF4FF" stroke="#A855F7" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="618" y="204" width="164" height="24" rx="6" fill="#9333EA"/>
  <text x="700" y="220" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">ມາດຕະການແກ້ໄຂ 4 ຂັ້ນຕອນ</text>
  <text x="626" y="242" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#6B21A8">1. ສ້າງກຳແພງ 2.2m ຕັດມຸມ</text>
  <text x="626" y="259" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#6B21A8">2. ປູກຕົ້ນສົນ/ໄຜ່ດູດແຮງລົມ</text>
  <text x="626" y="276" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#6B21A8">3. ຕັ້ງສີລາໄທຊານ (Tai Shan)</text>
  <text x="626" y="293" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#6B21A8">4. ປັບມຸມແຫຼມເປັນສວນຫຍ້າ</text>
  
  <rect x="620" y="324" width="162" height="110" rx="4" fill="#F3E8FF"/>
  <text x="700" y="342" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.8" fill="#7E22CE" text-anchor="middle">ຂໍ້ຫ້າມເດັດຂາດ (Taboos)</text>
  <text x="630" y="360" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#9333EA">• ຫ້າມສ້າງຫ້ອງນອນໃນມຸມແຫຼມ</text>
  <text x="630" y="377" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#9333EA">• ຫ້າມເປີດປະຕູກົງມຸມແຫຼມ</text>
  <text x="630" y="394" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.2" fill="#9333EA">• ຫ້າມມີໜອງນ້ຳກົງມຸມແຫຼມ</text>
  <text x="700" y="418" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.2" fill="#7E22CE" text-anchor="middle">✓ ປ່ຽນເປັນເຂດສວນກັນຊົນ</text>

