  <text x="425" y="282" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#475569" text-anchor="middle">ຕັ້ງໃນເຂດປອດໄພ (Safe Zone)</text>
  
