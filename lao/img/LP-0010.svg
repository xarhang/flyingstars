        <text x="225" y="150" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#64748B" text-anchor="middle" transform="rotate(-90 225 150)">ເພື່ອນບ້ານຊ້າຍ</text>
