        <text x="424" y="144" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#475569" text-anchor="middle">ຫ້ອງໂຖງໃຫຍ່</text>
        
        <!-- Front Main Entrance Door / Porch -->
