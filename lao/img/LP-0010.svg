        <line x1="560" y1="95" x2="560" y2="200" stroke="#334155" stroke-width="3"/>
        <line x1="560" y1="200" x2="460" y2="200" stroke="#DC2626" stroke-width="3"/>
        <line x1="460" y1="200" x2="460" y2="355" stroke="#334155" stroke-width="3"/>

