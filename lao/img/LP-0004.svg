  <text x="577" y="25" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8" text-anchor="middle">ທາດນ້ຳ/ທອງ Water/Metal / 水金</text>

  <!-- Score Badge -->
