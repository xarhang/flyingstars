      <text x="428.5" y="160" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#475569" text-anchor="middle">ຫ້ອງໂຖງໃຫຍ່</text>
    
    
        <!-- Front Main Door Step & Prominent Label -->
