  <text x="400" y="465" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">ຫຼັກການຮວງຈຸ້ຍ: ຖະໜົນສາຍໂຄ້ງໂອບອຸ້ມຄື &apos;ນ້ຳທຽມມີໄມຕີ&apos; (Virtual Water). ລົດແລ່ນຊ້າລົງ ພະລັງຊີ່ໄຫຼວຽນອ່ອນນ້ອມ ດຶງດູດລູກຄ້າ ແລະ ຊັບສິນ.</text>
