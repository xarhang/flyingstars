
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="cemeteryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- TOP TITLE HUD BAR -->
  <rect x="0" y="0" width="800" height="42" fill="#0F172A"/>
  <rect x="18" y="9" width="80" height="24" rx="4" fill="#DC2626"/>
  <text x="58" y="25" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">ENV-0001</text>
  <text x="108" y="26" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#F8FAFC">ສຸສານ &amp; ປ່າຊ້າ: ຫຼັກຮວງຈຸ້ຍສຸສານນອກດິນ vs ຢູ່ໃນດິນ (Cemetery Yin Sha &amp; Remedies)</text>
  <rect x="580" y="9" width="105" height="24" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="632" y="25" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8" text-anchor="middle">ຢິນຊ່າ / Yin Sha</text>
  <rect x="692" y="9" width="90" height="24" rx="4" fill="#991B1B"/>
  <text x="737" y="25" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10.5" fill="#FEF2F2" text-anchor="middle">ລະວັງສູງ</text>

  <!-- LEFT COLUMN CARDS -->
  <rect x="12" y="48" width="174" height="185" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="48" width="174" height="24" rx="6" fill="#475569"/>
  <text x="100" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">⚰️ ສຸສານຢູ່ນອກດິນ (Outside)</text>
  <text x="20" y="86" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#1E293B">• ໄລຍະປອດໄພ: ຫ່າງ >150-200 ແມັດ</text>
  <text x="20" y="103" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#1E293B">• ຫາກໃກ້ &lt;50-100m: ໄອຢິນເຢັນແຜ່</text>
  <text x="20" y="120" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#1E293B">• ຜົນກະທົບ: ເຈັບປ່ວຍ, ຝັນຮ້າຍ, ຈິດຫຼອນ</text>
  <rect x="18" y="132" width="162" height="42" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="99" y="146" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.2" fill="#0F172A" text-anchor="middle">ກຳແພງ 2.2m + ຕົ້ນສົນ + ໄຟຢາງ</text>
  <text x="99" y="162" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.8" fill="#475569" text-anchor="middle">ຕັດສາຍຕາ ບໍ່ໃຫ້ຫຼຽວເຫັນສຸສານ</text>

  <rect x="12" y="240" width="174" height="202" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="12" y="240" width="174" height="24" rx="6" fill="#DC2626"/>
  <text x="100" y="256" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">🚫 ສຸສານຢູ່ໃນດິນ (Inside Plot)</text>
  <text x="20" y="278" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#991B1B">• ເປັນຢິນຊ່າຂັ້ນຮຸນແຮງ (Extreme Yin)</text>
  <text x="20" y="295" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#991B1B">• ຫ້າມປຸກເຮືອນທັບຈຸດສຸສານເດັດຂາດ</text>
  <text x="20" y="312" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.8" fill="#991B1B">• ຄົນຢູ່ຈະອັບໂຊກ, ປ່ວຍຊຳເຮື້ອ</text>
  <rect x="18" y="325" width="162" height="48" rx="4" fill="#FEE2E2"/>
  <text x="99" y="340" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.2" fill="#B91C1C" text-anchor="middle">3 ຂັ້ນຕອນແກ້ໄຂດິນສຸສານເກົ່າ:</text>
  <text x="24" y="354" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.5" fill="#7F1D1D">1. ຍ້າຍອັດຖິອອກຕາມພິທີ</text>
  <text x="24" y="366" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.5" fill="#7F1D1D">2. ລອກດິນ 1.5m ຕາກແດດ 49 ວັນ</text>

  <!-- CENTER SITE PLAN (X=195 to 605, Y=48 to 442) -->
  <g id="centerSite">
    <rect x="195" y="48" width="410" height="95" fill="url(#cemeteryGrad)" stroke="#94A3B8" stroke-width="1"/>
    <text x="400" y="65" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8.5" fill="#475569" text-anchor="middle">ສຸສານ / ປ່າຊ້າພາຍນອກ (External Cemetery &amp; Ancestral Graves)</text>
    
    <path d="M 230 115 A 20 16 0 0 1 270 115 Z" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>
    <rect x="246" y="90" width="8" height="14" fill="#64748B" rx="1"/>
    <path d="M 330 115 A 22 18 0 0 1 374 115 Z" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>
    <rect x="348" y="88" width="8" height="15" fill="#64748B" rx="1"/>
    <path d="M 430 115 A 22 18 0 0 1 474 115 Z" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>
    <rect x="448" y="88" width="8" height="15" fill="#64748B" rx="1"/>
    <path d="M 530 115 A 20 16 0 0 1 570 115 Z" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>
    <rect x="546" y="90" width="8" height="14" fill="#64748B" rx="1"/>

    <path d="M 250 120 L 250 138" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,2"/>
    <polygon points="250,142 247,136 253,136" fill="#38BDF8"/>
    <path d="M 400 120 L 400 138" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,2"/>
    <polygon points="400,142 397,136 403,136" fill="#38BDF8"/>
    <path d="M 550 120 L 550 138" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,2"/>
    <polygon points="550,142 547,136 553,136" fill="#38BDF8"/>
    <text x="400" y="132" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#0284C7" text-anchor="middle">⬇ ໄອຢິນເຢັນ (Yin Sha) ແຜ່ລົງມາ</text>

    <!-- Defensive Boundary -->
    <rect x="200" y="143" width="400" height="6" fill="#334155" stroke="#0F172A" stroke-width="1"/>
    <circle cx="215" cy="155" r="7" fill="#14532D"/>
    <circle cx="240" cy="155" r="7" fill="#166534"/>
    <circle cx="265" cy="155" r="7" fill="#14532D"/>
    <circle cx="290" cy="155" r="7" fill="#166534"/>
    <circle cx="315" cy="155" r="7" fill="#14532D"/>
    <rect x="375" y="145" width="50" height="15" rx="2" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
    <text x="400" y="156" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#F8FAFC" text-anchor="middle">TAI SHAN</text>
    <circle cx="485" cy="155" r="7" fill="#14532D"/>
    <circle cx="510" cy="155" r="7" fill="#166534"/>
    <circle cx="535" cy="155" r="7" fill="#14532D"/>
    <circle cx="560" cy="155" r="7" fill="#166534"/>
    <circle cx="585" cy="155" r="7" fill="#14532D"/>
    <circle cx="350" cy="146" r="3.5" fill="#FBBF24" stroke="#D97706" stroke-width="1"/>
    <circle cx="450" cy="146" r="3.5" fill="#FBBF24" stroke="#D97706" stroke-width="1"/>
    <text x="400" y="171" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.8" fill="#166534" text-anchor="middle">✓ ແນວກຳແພງ 2.2m + ຕົ້ນສົນໜາ + ໄຟສີອຸ່ນ + ຫີນ Tai Shan ສະກັດກັ້ນໄອຢິນ</text>

    <!-- Residential Ground -->
    <rect x="200" y="175" width="400" height="225" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>

    <!-- Safe House -->
    <polygon points="340,210 400,190 460,210" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
    <rect x="345" y="210" width="110" height="55" fill="#FEF08A" stroke="#854D0E" stroke-width="1.8" rx="3"/>
    <text x="400" y="235" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="9.5" fill="#1E293B" text-anchor="middle">ເຮືອນພັກອາໄສ (Yang Zhai)</text>
    <text x="400" y="248" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7" fill="#475569" text-anchor="middle">ປອດໄພຈາກໄອຢິນ ດ້ວຍແນວກຳແພງຫຼັງ</text>
    <rect x="392" y="262" width="16" height="5" fill="#1E293B"/>

    <!-- Taboo Grave Zone Inside -->
    <g transform="translate(225, 275)">
      <rect x="0" y="0" width="95" height="75" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3"/>
      <path d="M 25 35 A 14 10 0 0 1 55 35 Z" fill="#94A3B8" stroke="#DC2626" stroke-width="1"/>
      <line x1="20" y1="18" x2="60" y2="52" stroke="#DC2626" stroke-width="2.5"/>
      <line x1="60" y1="18" x2="20" y2="52" stroke="#DC2626" stroke-width="2.5"/>
      <text x="47" y="14" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.5" fill="#DC2626" text-anchor="middle">🚫 ຈຸດສຸສານເກົ່າໃນດິນ</text>
      <text x="47" y="66" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="5.5" fill="#991B1B" text-anchor="middle">ຫ້າມປຸກຫ້ອງນອນທັບ</text>
    </g>
    <path d="M 272 352 C 272 375 285 385 305 385" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="3,2"/>
    <polygon points="310,385 303,381 303,389" fill="#16A34A"/>
    <text x="272" y="375" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="5.5" fill="#15803D">ລອກດິນ 1.5m ປ່ຽນເປັນສວນດອກໄມ້</text>

    <!-- Ming Tang Lawn -->
    <rect x="340" y="285" width="220" height="60" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="450" y="302" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.8" fill="#15803D" text-anchor="middle">ລານໝິງຖາງໂລ່ງແຈ້ງ (Bright Hall / ເຕົ້າໂຮມພະລັງງານ)</text>
    <text x="450" y="316" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.5" fill="#166534" text-anchor="middle">✓ ລານຫຍ້າຂຽວໂລ່ງຮັບແສງແດດ &amp; ພະລັງຢາງ (Yang Qi)</text>
    <text x="450" y="330" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6" fill="#0284C7" text-anchor="middle">• ອ່າງນ້ຳພຸກົມ 10-15% ຝັ່ງມັງກອນຂຽວ (ຖ້າມີ)</text>

    <!-- Front Road -->
    <rect x="200" y="400" width="400" height="25" fill="#334155"/>
    <line x1="200" y1="412" x2="600" y2="412" stroke="#FBBF24" stroke-width="2" stroke-dasharray="8,6"/>
    <text x="400" y="420" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#FFFFFF" text-anchor="middle">ຖະໜົນໃຫຍ່ດ້ານໜ້າ (Facing Main Road) ຮັບແສງສະຫວ່າງ</text>

    <rect x="420" y="396" width="30" height="8" rx="1.5" fill="#15803D"/>
    <text x="435" y="402" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="5.5" fill="#FFFFFF" text-anchor="middle">✓ ປະຕູຮົ້ວ</text>
  </g>

  <!-- RIGHT COLUMN CARDS -->
  <rect x="614" y="48" width="174" height="185" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="48" width="174" height="24" rx="6" fill="#15803D"/>
  <text x="701" y="64" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8.8" fill="#FFFFFF" text-anchor="middle">🛡️ 4 ວິທີແກ້ສຸສານນອກດິນ</text>
  <text x="622" y="86" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#14532D">1. ກຳແພງທຶບສູງ 2.0-2.2 ແມັດ</text>
  <text x="622" y="103" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#14532D">2. ປູກແນວຕົ້ນສົນ/ໄຜ່ໃບໜາບັງ</text>
  <text x="622" y="120" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#14532D">3. ຕິດໂຄມໄຟສີອຸ່ນ Warm Yang</text>
  <text x="622" y="137" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#14532D">4. ຕັ້ງສີລາ Tai Shan ສະກັດກັ້ນ</text>
  <rect x="620" y="148" width="162" height="30" rx="3" fill="#DCFCE7"/>
  <text x="701" y="161" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="6.8" fill="#166534" text-anchor="middle">ກົດຫຼັກ: ຕັດສາຍຕາບໍ່ໃຫ້ເຫັນ</text>
  <text x="701" y="172" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.2" fill="#14532D" text-anchor="middle">ບໍ່ເຫັນ = ບໍ່ເກີດຊ່າ (ຕາບໍ່ເຫັນບໍ່ເປັນພະລັງພິສ)</text>

  <rect x="614" y="240" width="174" height="202" rx="6" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="614" y="240" width="174" height="24" rx="6" fill="#7E22CE"/>
  <text x="701" y="256" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8.8" fill="#FFFFFF" text-anchor="middle">🛠️ 3 ຂັ້ນຕອນແກ້ສຸສານໃນດິນ</text>
  <text x="622" y="278" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#581C87">1. ຍ້າຍອັດຖິອອກຢ່າງສົມກຽດ</text>
  <text x="622" y="295" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#581C87">2. ຂຸດດິນເລິກ 1.5m ຕາກແດດ 49 ວັນ</text>
  <text x="622" y="312" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#581C87">3. ຖົມດິນໃໝ່ສະອາດ + ປູກຫຍ້າ</text>
  <rect x="620" y="325" width="162" height="48" rx="3" fill="#F3E8FF"/>
  <text x="701" y="339" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#6B21A8" text-anchor="middle">ຂໍ້ຫ້າມສຳຄັນທີ່ສຸດ:</text>
  <text x="701" y="352" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.5" fill="#581C87" text-anchor="middle">ຫ້າມສ້າງຫ້ອງນອນ/ຫ້ອງຮັບແຂກທັບ</text>
  <text x="701" y="364" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.2" fill="#7E22CE" text-anchor="middle">ໃຫ້ຈັດເປັນສວນດອກໄມ້ ຫຼື ບ່ອນຈອດລົດ</text>

  <!-- BOTTOM SUMMARY BAR -->
  <rect x="0" y="445" width="800" height="35" fill="#0F172A"/>
  <text x="400" y="460" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#F8FAFC" text-anchor="middle">ຫຼັກການຮວງຈຸ້ຍສຸສານ: ເຮືອນພັກອາໄສເປັນ Yang Zhai ຕ້ອງການພະລັງງານຊີວິດ. ສຸສານນອກດິນແກ້ດ້ວຍກຳແພງ 2.2m + ຕົ້ນສົນ + ໄຟຢາງ.</text>
  <text x="400" y="472" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6.8" fill="#94A3B8" text-anchor="middle">ສຸສານໃນດິນເປັນຢິນຊ່າຮຸນແຮງ: ຕ້ອງຍ້າຍອັດຖິ, ລອກດິນ 1.5m ຕາກແດດ 49 ວັນ, ແລະ ຫ້າມປຸກຫ້ອງນອນທັບຈຸດສຸສານເດັດຂາດ.</text>
</svg>
