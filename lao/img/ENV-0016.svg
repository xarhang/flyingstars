        <text x="550" y="228" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="8" fill="#0C4A6E" text-anchor="middle" transform="rotate(90 550 228)">ໜອງປາ/ອ່າງເກັບນ້ຳ</text>

