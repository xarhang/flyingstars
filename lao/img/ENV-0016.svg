  <text x="400" y="465" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">ຖືກລ້ອມຮອບດ້ວຍອາຄານ 3 ດ້ານ, ລົມທຳມະຊາດເຂົ້າໄດ້ສະເພາະດ້ານໜ້າ, ຖ້າບໍ່ມີຊ່ອງແສງກາງເຮືອນ ອາກາດຈະອົບເອົ້າ.</text>
