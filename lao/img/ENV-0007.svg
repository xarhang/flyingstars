  <text x="20" y="286" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">ໂດຍສະເພາະຄົນທາດນ້ຳ (1) ແລະ ທ</text>
  <text x="20" y="306" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">• ✗ ບໍ່ຖືກກັບ: ບໍ່ມີຂໍ້ຂັດແຍ້ງ (ຍົກເວັ້</text>
  <text x="20" y="326" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="8" fill="#78350F">ນຄົນທາດໄຟ 9 ຄວນປູກຕົ້ນໄມ້ເຊື</text>
  
