  <text x="100" y="170" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#15803D" text-anchor="middle">ຕຳແໜ່ງ: ສາຍນ້ຳໂອບອຸ້ມລ້ວນໆ (</text>
