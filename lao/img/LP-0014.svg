  <text x="400" y="469" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#CBD5E1" text-anchor="middle">ເກີດລົມພຸ່ງຊົນຮຸນແຮງ ຕ້ອງຕັ້ງໂຄມໄຟນຳທາງ ແລະ ວົງວຽນລົດ.</text>
