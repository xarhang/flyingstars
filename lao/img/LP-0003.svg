  <text x="726" y="25" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="10.5" fill="#FEF2F2" text-anchor="middle">ດີເລີດ: 98 / 100</text>

  <!-- ========================================================================= -->
