    <rect x="20" y="420" width="760" height="50" rx="6" fill="#FFFFFF" fill-opacity="0.96" stroke="#DC2626" stroke-width="1.2"/>
    <text x="32" y="438" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#0F172A">ລັກສະນະພະລັງງານ: </tspan>ສາຍນ້ຳໄຫຼຊິດແຄມຖານອາຄານເກີນໄປ (ຕ່ຳກວ່າ 3 ແມັດ), ນ້ຳກັດເຊາະຮາກຖານເຮືອນຢ່າງຕໍ່ເນື່ອງ.</text>
    <text x="32" y="458" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#0F172A">ວິທີແກ້ໄຂ / ຂໍ້ແນະນຳ: </tspan>ຖົມດິນຂະຫຍາຍແຄມຕາຝັ່ງ, ສ້າງຄັນຄູຄອນກຣີດປ້ອງກັນການກັດເຊາະ, ປູກຫຍ້າແຝກ.</text>
  
