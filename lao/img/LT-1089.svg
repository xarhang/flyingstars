    <text x="402" y="196" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="11" fill="#B91C1C" text-anchor="middle">ສາຍນ້ຳໄຫຼຄົດຄ້ຽວຢ່າງຊ້າໆ ນຳພາພະລັງມຸງຄຸນ</text>
  
  
  
