    <text x="32" y="438" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#0F172A">ລັກສະນະພະລັງງານ: </tspan>ຍອດພູແຫຼມສ້ຽມຄືແປວໄຟ, ຜາຫີນແຕກຫັກສີແດງຄືດາບປາຍແຫຼມ. ພະລັງທາດໄຟແຜ່ລັງສີຮ້ອນແຮງ.</text>
    <text x="32" y="458" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#0F172A">ວິທີແກ້ໄຂ / ຂໍ້ແນະນຳ: </tspan>ສ້າງກຳແພງສູງທາສີເຫຼືອງທາດດິນ, ຂຸດອ່າງນ້ຳດັບພະລັງໄຟ, ປູກຕົ້ນໄມ້ທຶບປິດບັງສາຍຕາ.</text>
  
