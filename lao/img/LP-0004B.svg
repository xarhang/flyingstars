        <rect x="345" y="245" width="110" height="58" rx="5" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="400" y="260" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#15803D" text-anchor="middle">ລານໝິງຖາງ (Bright Hall)</text>
        <text x="400" y="274" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6" fill="#166534" text-anchor="middle">ປາກນ້ຳເຕົ້າດູດພະລັງໂຊກລາບ</text>
        <text x="400" y="287" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="6" fill="#0369A1" text-anchor="middle">• ລານຫຍ້າຂຽວໂລ່ງ ຮັບແສງ-ລົມ</text>
        
