  </g>

  
  <!-- Bottom Doctrinal Summary -->
  <rect x="12" y="445" width="776" height="29" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
  <text x="400" y="457" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.5" fill="#F8FAFC" text-anchor="middle">ຫຼັກການຮວງຈຸ້ຍ: ຕອນດິນຮູບນ້ຳເຕົ້າປີ້ນດ້ານ (ປາກແຄບດ້ານໜ້າ ຫຼັງກວ້າງໃຫຍ່) ເປັນມຸງຄຸນສູງສຸດ</text>
  <text x="400" y="469" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="7.5" fill="#CBD5E1" text-anchor="middle">ປຽບເໝືອນໂຖດູດຊັບ: ດູດພະລັງໂຊກລາບຜ່ານປາກແຄບ ແລ້ວສະສົມກັກເກັບໄວ້ໃນທ້ອງໃຫຍ່ດ້ານຫຼັງ ບໍ່ໃຫ້ຮົ່ວໄຫຼ.</text>
