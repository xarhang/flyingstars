    <text x="32" y="438" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#0F172A">ລັກສະນະພະລັງງານ: </tspan>ພູເຂົາຫຼັງພຽງຄືໜ້າໂຕະ (Plateau / Mesa), ຖານກວ້າງໃຫຍ່ໜັກແໜ້ນ. ພະລັງທາດດິນສະສົມຢ່າງສະຫງົບ.</text>
    <text x="32" y="458" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#0F172A">ວິທີແກ້ໄຂ / ຂໍ້ແນະນຳ: </tspan>ຮັກສາພື້ນທີ່ໃຫ້ສະອາດ, ຫ້າມຂຸດເຈາະທຳລາຍສັນເຂົາດ້ານຫຼັງ, ປູກຫຍ້າຂຽວບຳລຸງໜ້າດິນ.</text>
  
