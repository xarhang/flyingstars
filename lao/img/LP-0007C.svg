        <line x1="370" y1="145" x2="430" y2="145" stroke="#15803D" stroke-width="6"/>
        <rect x="330" y="151" width="140" height="15" rx="3" fill="#15803D"/>
        <text x="400" y="162" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-weight="bold" font-size="7.2" fill="#FFFFFF" text-anchor="middle">[+] ກຳແພງ 2.2m ຕັດມຸມ</text>

