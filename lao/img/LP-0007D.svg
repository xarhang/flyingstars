  <text x="400" y="465" font-family="'Noto Sans Lao', 'Segoe UI', sans-serif" font-size="9.5" fill="#F8FAFC" text-anchor="middle">ຫຼັກການຮວງຈຸ້ຍ: ຕອນດິນສາມຫຼ່ຽມຫົວແຫຼມຊີ້ອອກຫາຖະໜົນໜ້າບ້ານ (ຫຼັງກວ້າງ), ມຸມແຫຼມສ້າງພະລັງພິສທາດໄຟ (Fire Sha) ຕຳໃສ່ກະແສຈະລາຈອນ. ຕ້ອງສ້າງກຳແພງຕັດມຸມແຫຼມໜ້າ ເພື່ອສ້າງລານຕ້ອນຮັບສີ່ຫຼ່ຽມ, ວາງເຮືອນຢູ່ຫຼັງກວ້າງ, ເຮັດທາງລົດໂຄ້ງ S-Curve ແລະ ຮັກສາລານໝິງຖາງໂລ່ງແຈ້ງ.</text>
