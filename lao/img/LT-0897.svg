    <text x="32" y="458" font-family="'Phetsarath OT', 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#0F172A">ວິທີແກ້ໄຂ / ຂໍ້ແນະນຳ: </tspan>ສ້າງກຳແພງຫີນແກຣນິດໂຄ້ງສະທ້ອນພະລັງຮ້າຍ, ປູກແນວຕົ້ນໄມ້ກັນຊົນທຶບ, ຕັ້ງກະຈົກນູນແກ້ໄຂ.</text>
  
